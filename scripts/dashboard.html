<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Dashboard — Desideriushogeschool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse-live { animation: pulse-green 1s infinite; }
    .pulse-dead { animation: pulse-red 1.5s infinite; }
    .bar-fill { transition: width 0.5s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen font-mono">

  <!-- Header -->
  <header class="border-b border-gray-200 bg-white px-6 py-4 flex items-center justify-between shadow-sm">
    <div>
      <h1 class="text-xl font-bold text-gray-900">CRM Dashboard</h1>
      <p class="text-sm text-gray-500">Desideriushogeschool — ShiftFestival — Integratieproject 2026</p>
    </div>
    <div class="flex items-center gap-3">
      <div id="connection-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100">
        <span id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
        <span id="connection-label" class="text-xs text-gray-500">Connecting...</span>
      </div>
      <div id="heartbeat-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100">
        <span id="heartbeat-dot" class="w-3 h-3 rounded-full bg-gray-400"></span>
        <span id="heartbeat-label" class="text-sm text-gray-500">Checking...</span>
      </div>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="border-b border-gray-200 bg-white px-6 py-3 flex gap-8">
    <div class="flex-1">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>CPU</span><span id="cpu-val">--%</span>
      </div>
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div id="cpu-bar" class="bar-fill h-full bg-emerald-500 rounded-full" style="width:0%"></div>
      </div>
    </div>
    <div class="flex-1">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>Memory</span><span id="mem-val">--%</span>
      </div>
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div id="mem-bar" class="bar-fill h-full bg-blue-500 rounded-full" style="width:0%"></div>
      </div>
    </div>
    <div class="flex-1">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span>Disk</span><span id="disk-val">--%</span>
      </div>
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div id="disk-bar" class="bar-fill h-full bg-amber-500 rounded-full" style="width:0%"></div>
      </div>
    </div>
    <div class="flex items-center">
      <span id="container-badge" class="text-xs px-2 py-1 rounded bg-gray-100 text-gray-500">Container: --</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex" style="min-height: calc(100vh - 140px)">
    <!-- Event Log -->
    <div class="w-1/2 border-r border-gray-200 p-6 overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">CRUD Event Log</h2>
        <div class="flex gap-2">
          <button id="btn-create" onclick="crudAction('create')"
            class="px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
            + CREATE
          </button>
          <button id="btn-update" onclick="crudAction('update')" disabled
            class="px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed transition-colors">
            ~ UPDATE
          </button>
          <button id="btn-delete" onclick="crudAction('delete')" disabled
            class="px-3 py-1.5 text-xs font-semibold rounded-md bg-red-600 text-white hover:bg-red-700 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed transition-colors">
            - DELETE
          </button>
        </div>
      </div>
      <div id="event-log" class="space-y-2">
        <p class="text-gray-400 text-sm">Click CREATE to start a CRUD flow, or run demo_crud_user.py</p>
      </div>
    </div>

    <!-- Salesforce Contacts -->
    <div class="w-1/2 p-6">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Salesforce Contacts</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b border-gray-200">
              <th class="pb-2 pr-4">ID</th>
              <th class="pb-2 pr-4">Name</th>
              <th class="pb-2 pr-4">Email</th>
              <th class="pb-2">Role</th>
            </tr>
          </thead>
          <tbody id="contacts-body">
            <tr><td colspan="4" class="py-4 text-gray-600">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Queue Flow Modal -->
  <div id="flow-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50" style="display:none">
    <div class="bg-white rounded-xl shadow-2xl border border-gray-200 max-w-lg w-full mx-4 overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
        <h3 id="flow-title" class="font-bold text-gray-900">Queue Flow</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <div id="flow-body" class="p-5"></div>
    </div>
  </div>

  <script>
    const API = '';

    // ── Queue Flow Definitions ────────────────────────────────
    const flowDefs = {
      CREATE: {
        title: 'CREATE Flow — Contract 1 + 13',
        steps: [
          { label: 'Frontend', type: 'source', color: 'blue' },
          { label: 'frontend.registration.created', type: 'queue', color: 'amber' },
          { label: 'CRM Receiver', type: 'process', color: 'gray', detail: 'XML validate + Salesforce Contact create' },
          { label: 'Salesforce', type: 'store', color: 'blue', detail: 'Contact record aangemaakt' },
          { label: 'crm.user.confirmed', type: 'queue', color: 'amber' },
          { label: 'Alle consumers', type: 'target', color: 'emerald', detail: 'Kassa, Mailing, Facturatie, Frontend' },
        ]
      },
      UPDATE: {
        title: 'UPDATE Flow — Contract 2 + 18',
        steps: [
          { label: 'Frontend', type: 'source', color: 'blue' },
          { label: 'frontend.registration.updated', type: 'queue', color: 'amber', detail: 'changeType=updated' },
          { label: 'CRM Receiver', type: 'process', color: 'gray', detail: 'XML validate + Salesforce Contact upsert' },
          { label: 'Salesforce', type: 'store', color: 'blue', detail: 'Contact record bijgewerkt' },
          { label: 'crm.user.updated', type: 'queue', color: 'amber', detail: 'Volledig object (geen partial merge)' },
          { label: 'Alle consumers', type: 'target', color: 'emerald', detail: 'Vervangen lokale kopie volledig' },
        ]
      },
      DELETE: {
        title: 'DELETE Flow — Contract 2 + 22',
        steps: [
          { label: 'Frontend', type: 'source', color: 'blue' },
          { label: 'frontend.registration.updated', type: 'queue', color: 'amber', detail: 'changeType=cancelled' },
          { label: 'CRM Receiver', type: 'process', color: 'gray', detail: 'XML validate + Salesforce soft delete' },
          { label: 'Salesforce', type: 'store', color: 'blue', detail: 'isActive = false (GDPR)' },
          { label: 'crm.user.deactivated', type: 'queue', color: 'amber' },
          { label: 'Alle consumers', type: 'target', color: 'red', detail: 'Kassa/Mailing/Facturatie verwijderen data' },
        ]
      }
    };

    const stepIcons = { source: '\u25B6', queue: '\u2709', process: '\u2699', store: '\u2601', target: '\u2714' };

    function openModal(eventType, email) {
      const flow = flowDefs[eventType];
      if (!flow) return;

      setContent('flow-title', flow.title);
      const body = document.getElementById('flow-body');
      body.replaceChildren();

      // Email banner
      const banner = document.createElement('div');
      banner.className = 'text-xs text-gray-500 mb-4 font-mono bg-gray-50 rounded px-3 py-1.5';
      banner.textContent = email || '';
      body.appendChild(banner);

      flow.steps.forEach((step, i) => {
        // Arrow between steps
        if (i > 0) {
          const arrow = document.createElement('div');
          arrow.className = 'flex justify-center py-1';
          const arrowIcon = document.createElement('span');
          arrowIcon.className = 'text-gray-300 text-lg';
          arrowIcon.textContent = '\u2193';
          arrow.appendChild(arrowIcon);
          body.appendChild(arrow);
        }

        const row = document.createElement('div');
        const bgColors = {
          queue: 'bg-amber-50 border-amber-200',
          process: 'bg-gray-50 border-gray-200',
          source: 'bg-blue-50 border-blue-200',
          store: 'bg-blue-50 border-blue-200',
          target: eventType === 'DELETE' ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200',
        };
        row.className = `flex items-center gap-3 px-4 py-2.5 rounded-lg border ${bgColors[step.type] || 'bg-gray-50 border-gray-200'}`;

        const icon = document.createElement('span');
        icon.className = 'text-base';
        icon.textContent = stepIcons[step.type] || '';
        row.appendChild(icon);

        const content = document.createElement('div');
        content.className = 'flex-1';

        const name = document.createElement('div');
        const textColors = {
          queue: 'text-amber-800 font-mono text-sm',
          process: 'text-gray-700 font-semibold text-sm',
          source: 'text-blue-700 font-semibold text-sm',
          store: 'text-blue-700 font-semibold text-sm',
          target: 'text-gray-700 font-semibold text-sm',
        };
        name.className = textColors[step.type] || 'text-gray-700 text-sm';
        name.textContent = step.label;
        content.appendChild(name);

        if (step.detail) {
          const detail = document.createElement('div');
          detail.className = 'text-xs text-gray-500 mt-0.5';
          detail.textContent = step.detail;
          content.appendChild(detail);
        }

        row.appendChild(content);

        const badge = document.createElement('span');
        badge.className = 'text-xs text-gray-400';
        badge.textContent = step.type === 'queue' ? 'RabbitMQ' : step.type === 'store' ? 'Cloud' : '';
        row.appendChild(badge);

        body.appendChild(row);
      });

      const modal = document.getElementById('flow-modal');
      modal.style.display = 'flex';
      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('flow-modal');
      modal.style.display = 'none';
      modal.classList.add('hidden');
    }

    // Close on backdrop click
    document.getElementById('flow-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // ── Helpers ─────────────────────────────────────────────
    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.textContent;
    }

    function setContent(id, text) {
      document.getElementById(id).textContent = text;
    }

    function setClass(id, cls) {
      document.getElementById(id).className = cls;
    }

    // ── Connection Info ───────────────────────────────────
    async function pollConnection() {
      try {
        const r = await fetch(`${API}/api/connection`);
        const d = await r.json();
        const dot = document.getElementById('connection-dot');
        const label = document.getElementById('connection-label');
        const badge = document.getElementById('connection-badge');

        if (d.connected) {
          const isVm = d.mode === 'vm';
          dot.className = isVm
            ? 'w-2.5 h-2.5 rounded-full bg-purple-500 pulse-live'
            : 'w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-live';
          label.textContent = isVm ? `VM (${d.host})` : 'Lokaal';
          label.className = isVm ? 'text-xs text-purple-700 font-semibold' : 'text-xs text-emerald-700 font-semibold';
          badge.className = isVm
            ? 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-purple-50 border border-purple-200'
            : 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
          label.textContent = 'RabbitMQ Disconnected';
          label.className = 'text-xs text-red-600 font-semibold';
          badge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-50 border border-red-200';
        }
      } catch { /* ignore */ }
    }

    // ── Heartbeat + Container ──────────────────────────────
    async function pollHealth() {
      try {
        const r = await fetch(`${API}/api/health`);
        const d = await r.json();

        if (d.heartbeat_alive) {
          setClass('heartbeat-dot', 'w-3 h-3 rounded-full bg-emerald-500 pulse-live');
          setContent('heartbeat-label', 'LIVE');
          setClass('heartbeat-label', 'text-sm text-emerald-600');
          setClass('heartbeat-badge', 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200');
        } else {
          setClass('heartbeat-dot', 'w-3 h-3 rounded-full bg-red-500 pulse-dead');
          setContent('heartbeat-label', 'DOWN');
          setClass('heartbeat-label', 'text-sm text-red-600');
          setClass('heartbeat-badge', 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-50 border border-red-200');
        }

        const cb = document.getElementById('container-badge');
        cb.textContent = d.container_running ? 'Container: Running' : 'Container: Stopped';
        cb.className = d.container_running
          ? 'text-xs px-2 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200'
          : 'text-xs px-2 py-1 rounded bg-red-50 text-red-700 border border-red-200';
      } catch { /* network error, ignore */ }
    }

    // ── System Status ──────────────────────────────────────
    function setBar(barId, valId, pct) {
      const p = Math.min(Math.max(pct * 100, 0), 100);
      document.getElementById(barId).style.width = p + '%';
      setContent(valId, p.toFixed(0) + '%');
    }

    async function pollStatus() {
      try {
        const r = await fetch(`${API}/api/status`);
        const d = await r.json();
        setBar('cpu-bar', 'cpu-val', d.cpu);
        setBar('mem-bar', 'mem-val', d.memory);
        setBar('disk-bar', 'disk-val', d.disk);
      } catch { /* ignore */ }
    }

    // ── Contacts (safe DOM construction) ───────────────────
    async function pollContacts() {
      try {
        const r = await fetch(`${API}/api/contacts`);
        const data = await r.json();
        if (data.error) return;

        const body = document.getElementById('contacts-body');
        body.replaceChildren();

        if (!data.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'py-4 text-gray-600';
          td.textContent = 'No contacts found';
          tr.appendChild(td);
          body.appendChild(tr);
          return;
        }

        for (const c of data) {
          const tr = document.createElement('tr');
          tr.className = 'border-b border-gray-100 hover:bg-gray-50';

          const tdId = document.createElement('td');
          tdId.className = 'py-2 pr-4 text-gray-400 text-xs';
          tdId.textContent = (c.id || '').substring(0, 8) + '...';

          const tdName = document.createElement('td');
          tdName.className = 'py-2 pr-4 text-gray-900 font-medium';
          tdName.textContent = `${c.firstName || ''} ${c.lastName || ''}`;

          const tdEmail = document.createElement('td');
          tdEmail.className = 'py-2 pr-4 text-gray-600';
          tdEmail.textContent = c.email || '';

          const tdRole = document.createElement('td');
          tdRole.className = 'py-2';
          const roleSpan = document.createElement('span');
          roleSpan.className = c.role === 'COMPANY_CONTACT'
            ? 'text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-700'
            : 'text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600';
          roleSpan.textContent = c.role || 'N/A';
          tdRole.appendChild(roleSpan);

          tr.append(tdId, tdName, tdEmail, tdRole);
          body.appendChild(tr);
        }
      } catch { /* ignore */ }
    }

    // ── Events (safe DOM construction) ─────────────────────
    let lastEventCount = 0;

    const typeColors = { CREATE: 'text-emerald-600', UPDATE: 'text-blue-600', DELETE: 'text-red-600' };
    const typeIcons = { CREATE: '+', UPDATE: '~', DELETE: '-' };

    async function pollEvents() {
      try {
        const r = await fetch(`${API}/api/events`);
        const events = await r.json();
        if (events.length === lastEventCount) return;
        lastEventCount = events.length;

        const log = document.getElementById('event-log');
        log.replaceChildren();

        if (!events.length) return;

        for (const e of events) {
          const color = typeColors[e.type] || 'text-gray-400';
          const icon = typeIcons[e.type] || '?';
          let time = '';
          if (e.timestamp) {
            const d = new Date(e.timestamp);
            time = d.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          }

          const row = document.createElement('div');
          row.className = 'flex items-start gap-3 py-2 px-3 rounded bg-white border border-gray-200 shadow-sm cursor-pointer hover:border-blue-300 hover:bg-blue-50/50 transition-colors';
          row.addEventListener('click', () => openModal(e.type, e.email));

          const iconSpan = document.createElement('span');
          iconSpan.className = `font-bold ${color} w-5 text-center`;
          iconSpan.textContent = icon;

          const content = document.createElement('div');
          content.className = 'flex-1';

          const typeSpan = document.createElement('span');
          typeSpan.className = `${color} font-semibold`;
          typeSpan.textContent = e.type || 'EVENT';

          const contractSpan = document.createElement('span');
          contractSpan.className = 'text-gray-400 ml-2';
          contractSpan.textContent = e.contract || '';

          const emailSpan = document.createElement('span');
          emailSpan.className = 'text-gray-400 ml-2 text-xs';
          emailSpan.textContent = e.email || '';

          content.append(typeSpan, contractSpan, emailSpan);

          const timeSpan = document.createElement('span');
          timeSpan.className = 'text-gray-400 text-xs';
          timeSpan.textContent = time;

          row.append(iconSpan, content, timeSpan);
          log.appendChild(row);
        }
      } catch { /* ignore */ }
    }

    // ── CRUD Buttons ───────────────────────────────────────
    let crudBusy = false;
    let hasContact = false;

    function setCrudButtons(busy, created) {
      crudBusy = busy;
      hasContact = created;
      const btnCreate = document.getElementById('btn-create');
      const btnUpdate = document.getElementById('btn-update');
      const btnDelete = document.getElementById('btn-delete');

      btnCreate.disabled = busy;
      btnUpdate.disabled = busy || !created;
      btnDelete.disabled = busy || !created;

      btnCreate.textContent = (busy && btnCreate.dataset.active === '1') ? 'Creating...' : '+ CREATE';
      btnUpdate.textContent = (busy && btnUpdate.dataset.active === '1') ? 'Updating...' : '~ UPDATE';
      btnDelete.textContent = (busy && btnDelete.dataset.active === '1') ? 'Deleting...' : '- DELETE';
    }

    async function crudAction(action) {
      if (crudBusy) return;

      const btn = document.getElementById('btn-' + action);
      btn.dataset.active = '1';
      setCrudButtons(true, hasContact);

      try {
        const r = await fetch(`${API}/api/crud/${action}`, { method: 'POST' });
        const d = await r.json();

        if (d.ok) {
          if (action === 'create') setCrudButtons(false, true);
          else if (action === 'delete') setCrudButtons(false, false);
          else setCrudButtons(false, true);

          // Force refresh contacts and events
          pollContacts();
          pollEvents();
        } else {
          setCrudButtons(false, hasContact);
          const errorRow = document.createElement('div');
          errorRow.className = 'flex items-start gap-3 py-2 px-3 rounded bg-red-50 border border-red-200';
          const errorText = document.createElement('span');
          errorText.className = 'text-red-600 text-sm';
          errorText.textContent = 'Error: ' + (d.error || 'Unknown error');
          errorRow.appendChild(errorText);
          document.getElementById('event-log').prepend(errorRow);
        }
      } catch (err) {
        setCrudButtons(false, hasContact);
      }

      btn.dataset.active = '0';
    }

    // ── Start polling ──────────────────────────────────────
    pollConnection(); pollHealth(); pollStatus(); pollContacts(); pollEvents();
    setInterval(pollConnection, 5000);
    setInterval(pollHealth, 2000);
    setInterval(pollStatus, 5000);
    setInterval(pollContacts, 5000);
    setInterval(pollEvents, 2000);
  </script>
</body>
</html>
