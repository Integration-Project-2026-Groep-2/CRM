services:
  crm:
    build: .
    container_name: crm
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  crm-mcp:
    build: ./crm-mcp
    container_name: crm-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CRM_MCP_TRANSPORT=streamable-http
      - CRM_MCP_HOST=0.0.0.0
      - CRM_MCP_PORT=7001
    expose:
      - "7001"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
