services:
  crm:
    build: .
    container_name: crm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # MCP server draait als daemon-thread in dit proces (src/mcp_thread.py).
      # streamable-http luistert op 0.0.0.0:7001 binnen het docker-network.
      - CRM_MCP_TRANSPORT=streamable-http
      - CRM_MCP_HOST=0.0.0.0
      - CRM_MCP_PORT=7001
    expose:
      - "7001"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
