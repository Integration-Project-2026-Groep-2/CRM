asyncapi: 3.1.0
info:
  title: Integratieproject 2026 — CRM (Salesforce) RabbitMQ Contracts
  version: 1.8.0
  description: >
    XML-contracten voor alle integraties waarbij het CRM-team (Salesforce)
    betrokken is.

    Elk contract legt vast wie naar wie stuurt, via welke queue en in welk
    XML-formaat.

    Queue-namen zijn voorstellen — nog te bevestigen met de betrokken teams,
    tenzij anders vermeld.

    Alle berichten zijn XML-formaat (projectbrede afspraak, bevestigd door PMs).
  contact:
    name: Lars Cowé — CRM Team Lead
    email: lars.cowe@student.ehb.be
servers:
  production:
    host: integrationproject-2526s2-dag02.westeurope.cloudapp.azure.com:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: >-
      Azure VM — RabbitMQ broker (Infra team). Poort 5672 nog niet bevestigd
      open (zie infra-vm.md). RabbitMQ credentials pending bij Infra.
    security:
      - $ref: "#/components/securitySchemes/rabbitmq"
defaultContentType: application/xml

channels:
  # ============================================================
  # FRONTEND → CRM
  # ============================================================

  frontendRegistrationCreated:
    address: frontend.registration.created
    description: >-
      Contract 1 — Frontend → CRM: nieuwe inschrijving aanmaken (US-02, US-03,
      US-04, US-05, US-19 | R1)
    messages:
      registrationCreated:
        $ref: "#/components/messages/RegistrationCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  frontendRegistrationUpdated:
    address: frontend.registration.updated
    description: >-
      Contract 2 — Frontend → CRM: inschrijving wijzigen of annuleren (US-21 R1,
      US-33 R2)
    messages:
      registrationChanged:
        $ref: "#/components/messages/RegistrationChanged"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  frontendCompanyCreated:
    address: frontend.company.created
    description: >-
      Contract 3 (gecorrigeerd v1.3.0) — Frontend → CRM: nieuw bedrijf aanmaken
      als Account in Salesforce (US-40, US-20 | R1).

      ARCHITECTURELE CORRECTIE: in v1.2.0 was dit facturatie.company.created
      (Facturatie → CRM). Dat was verkeerd — CRM is master data owner.
      Facturatie is consumer van bedrijfsdata, geen producent. De eventbeheerder
      maakt bedrijven aan via de Frontend; CRM verwerkt en broadcast vervolgens
      crm.company.confirmed zodat Facturatie dat opslaat in FOSSBilling.

      PM-BESLISSING VEREIST: als bedrijven rechtstreeks in Salesforce aangemaakt
      worden (buiten Frontend om), vervalt dit inbound contract en is alleen
      crm.company.confirmed nodig.
    messages:
      companyCreated:
        $ref: "#/components/messages/CompanyCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # FACTURATIE → CRM (user sync)
  # ============================================================

  facturatieUserCreated:
    address: facturatie.user.created
    description: >-
      Contract 24 — Facturatie → CRM: handmatig aangemaakte klant in FOSSBilling
      synchroniseren naar Salesforce en een officiële CRM UUID laten toekennen.
    messages:
      facturatieUserCreated:
        $ref: "#/components/messages/FacturatieUserCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  facturatieUserUpdated:
    address: facturatie.user.updated
    description: >-
      Contract 25 — Facturatie → CRM: bestaande CRM-linked user vanuit
      Facturatie bijwerken in Salesforce.
    messages:
      facturatieUserUpdated:
        $ref: "#/components/messages/FacturatieUserUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  facturatieUserDeactivated:
    address: facturatie.user.deactivated
    description: >-
      Contract 26 — Facturatie → CRM: bestaande CRM-linked user soft-deactiveren
      in Salesforce.
    messages:
      facturatieUserDeactivated:
        $ref: "#/components/messages/FacturatieUserDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # MAILING → CRM (user sync)
  # ============================================================

  mailingUserCreated:
    address: mailing.user.created
    description: >-
      Contract 27 — Mailing → CRM: nieuwe Mailing-user synchroniseren naar
      Salesforce. Payload volgt de Mailing XSD met verplichte velden id, email
      en isActive. CRM bewaart id als native Mailing-identiteit
      (`Mailing_ID__c`) naast de eigen CRM UUID. Ontbreekt `lastName`, dan
      normaliseert CRM dit voor Salesforce naar het emailadres. Een
      company-linkage mag alleen een bestaand blank/VISITOR/COMPANY_CONTACT-contact
      veilig verrijken zonder conflict-event; daarbij telt ook een reeds
      opgeslagen `Company_ID__c` mee. Bij hergebruik van een bestaand Contact
      zet CRM alleen ontbrekende role/GDPR-velden recht voor het
      `crm.user.confirmed` verstuurt; een expliciete bestaande GDPR opt-out
      leidt tot conflict. Replays met hetzelfde `Mailing_ID__c` vergelijken
      e-mailadressen case-insensitief. Zonder dit Salesforce custom field
      verwerpt CRM het bericht als configuratiefout.
    messages:
      mailingUserCreated:
        $ref: "#/components/messages/MailingUserCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  mailingUserUpdated:
    address: crm.mailing.user.updated
    description: >-
      Contract 28 — Mailing → CRM: bestaande Mailing-user bijwerken in
      Salesforce. Het volledige object wordt meegestuurd voor consistentie met
      de producer-XSD. Queue-naam gebruikt consumer-prefix (`crm.`) om collision
      te voorkomen met Mailing's eigen consumer-queues op contact.topic.
      Mailing publiceert nog steeds met routing key `mailing.user.updated`.
    messages:
      mailingUserUpdated:
        $ref: "#/components/messages/MailingUserUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          name: crm.mailing.user.updated
          durable: true
        exchange:
          name: user.topic
          type: topic
          durable: true
        routingKeys:
          - mailing.user.updated

  mailingUserDeactivated:
    address: crm.mailing.user.deactivated
    description: >-
      Contract 29 — Mailing → CRM: bestaande Mailing-user soft-deactiveren in
      Salesforce op basis van GDPR- of annulatiepropagatie. Queue-naam gebruikt
      consumer-prefix om collision met Mailing's eigen consumer-queues te
      vermijden. Routing key blijft `mailing.user.deactivated`.
    messages:
      mailingUserDeactivated:
        $ref: "#/components/messages/MailingUserDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          name: crm.mailing.user.deactivated
          durable: true
        exchange:
          name: user.topic
          type: topic
          durable: true
        routingKeys:
          - mailing.user.deactivated

  # ============================================================
  # PLANNING → CRM (user sync)
  # ============================================================

  planningUserCreated:
    address: planning.user.created
    description: >-
      Contract 30 — Planning → CRM: Planning-user synchroniseren naar
      Salesforce (Planning ref 21). Payload volgt de Planning XSD met
      verplichte velden id, email, firstName, lastName, role en gdprConsent.
      phoneNumber en company blijven optioneel zoals door Planning
      aangeleverd.
    messages:
      planningUserCreated:
        $ref: "#/components/messages/PlanningUserCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  planningUserUpdated:
    address: planning.user.updated
    description: >-
      Contract 31 — Planning → CRM: bestaande Planning-user bijwerken in
      Salesforce (Planning ref 22). Planning verstuurt een volledig object met
      dezelfde veldset als het create-contract.
    messages:
      planningUserUpdated:
        $ref: "#/components/messages/PlanningUserUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  planningUserDeactivated:
    address: planning.user.deactivated
    description: >-
      Contract 32 — Planning → CRM: bestaande Planning-user soft-deactiveren
      in Salesforce (Planning ref 23).
    messages:
      planningUserDeactivated:
        $ref: "#/components/messages/PlanningUserDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # FACTURATIE → CRM (request/response)
  # ============================================================

  facturatieCompanyRequested:
    address: facturatie.company.requested
    description: >-
      Contract 5 (request) — Facturatie → CRM: bedrijfsdata opvragen via
      vatNumber (US-40, US-20 | R1)
    messages:
      companyDataRequest:
        $ref: "#/components/messages/CompanyDataRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyResponded:
    address: crm.company.responded
    description: >-
      Contract 5 (response) — CRM → Facturatie: bedrijfsdata terugsturen inclusief
      UUID (US-40, US-20 | R1). UUID toegevoegd v1.3.0.
    messages:
      companyDataResponse:
        $ref: "#/components/messages/CompanyDataResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CRM → MAILING
  # ============================================================

  crmMailRequested:
    address: crm.mail.requested
    description: >-
      Contract 6 — CRM → Mailing: deelnemersnotificatie via SendGrid (US-22,
      US-23 | R1). US-24 session_reminder is R2.
    messages:
      mailRequest:
        $ref: "#/components/messages/MailRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → CONTROLROOM
  # ============================================================

  crmHeartbeat:
    address: heartbeat.direct/routing.heartbeat
    description: >-
      Contract 7 — CRM → Controlroom: heartbeat elke 1 seconde (US-25, US-26 |
      R1). Publiceert naar exchange heartbeat.direct met routing key
      routing.heartbeat.
    messages:
      heartbeat:
        $ref: "#/components/messages/Heartbeat"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: heartbeat.direct
          type: direct
          durable: true

  crmStatusChecked:
    address: crm.status.checked
    description: >-
      Contract 8 — CRM → Controlroom: periodieke statuscheck met
      systeemmetrieken (US-25 | R1)
    messages:
      statusCheck:
        $ref: "#/components/messages/StatusCheck"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CONTROLROOM → CRM
  # ============================================================

  controlroomWarningIssued:
    address: controlroom.warning.issued
    description: >-
      Contract 9 — Controlroom → CRM: systeemwaarschuwing bij anomalie (US-26 |
      R1)
    messages:
      warning:
        $ref: "#/components/messages/Warning"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # KASSA → CRM (request/response)
  # ============================================================

  kassaPersonLookupRequested:
    address: kassa.person.lookup.requested
    description: >-
      Contract 10 (request) — Kassa → CRM: persoonscheck op basis van e-mail
      (US-47 | R1)
    messages:
      personLookup:
        $ref: "#/components/messages/PersonLookup"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmPersonLookupResponded:
    address: crm.person.lookup.responded
    description: >-
      Contract 10 (response) — CRM → Kassa: resultaat persoonscheck inclusief
      UUID (US-47 | R1). UUID + companyId toegevoegd v1.3.0.
    messages:
      personResponse:
        $ref: "#/components/messages/PersonResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # PLANNING → CRM
  # ============================================================

  planningSessionUpdated:
    address: planning.session.updated
    description: >-
      Contract 11 — Planning → CRM: sessiewijziging (US-23 R1, US-16 R2,
      US-53 R2). changeType=rescheduled dekt US-16 (sessie verzetten),
      changeType=cancelled dekt US-53 (sessie verwijderen). US-38
      (sprekernotificatie R3) is verantwoordelijkheid van Planning/Mailing — CRM
      beheert geen sprekerdata.
    messages:
      sessionUpdate:
        $ref: "#/components/messages/SessionUpdate"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # IOT → CRM
  # ============================================================

  iotBadgeLinked:
    address: iot.badge.linked
    description: >-
      Contract 12 — IoT → CRM: badge koppelen aan bezoeker via Raspberry Pi
      (US-28, US-29 | R2)
    messages:
      badgeLink:
        $ref: "#/components/messages/BadgeLink"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → ALLE CONSUMERS (UUID broadcasts — toegevoegd v1.3.0)
  # ============================================================

  crmUserConfirmed:
    address: crm.user.confirmed
    description: >-
      Contract 13 — CRM → alle consumers: Contact aangemaakt of bevestigd in
      Salesforce (US-02, US-19 | R1). Bevat het door CRM gegenereerde UUID v4.
      Consumers slaan dit op naast hun eigen native ID (Option 2 UUID-strategie).
      E-mail is de deduplicatiesleutel. Exacte replays of veilige identifier-
      koppelingen mogen dit event opnieuw publiceren; alleen conflicterende
      bestaande data leiden tot crm.user.conflict (Contract 15).
    messages:
      userConfirmed:
        $ref: "#/components/messages/UserConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyConfirmed:
    address: crm.company.confirmed
    description: >-
      Contract 14 — CRM → alle consumers: Account aangemaakt of bevestigd in
      Salesforce (US-40, US-20 | R1). Bevat het door CRM gegenereerde UUID v4.
      Facturatie slaat dit op naast FOSSBilling-ID. Kassa slaat dit op naast
      Odoo-ID.
    messages:
      companyConfirmed:
        $ref: "#/components/messages/CompanyConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → CONTROLROOM/FRONTEND (conflict — toegevoegd v1.3.0)
  # ============================================================

  crmUserConflict:
    address: crm.user.conflict
    description: >-
      Contract 15 — CRM → Controlroom + Frontend: conflicterende bestaande
      user-identiteit gedetecteerd tijdens create/sync (US-34, US-35 | R2).
      Dit event wordt gebruikt bij dubbele inschrijving op e-mail en bij
      conflicterende Mailing-ID-koppelingen. CRM logt beide waarden en
      publiceert dit event zodat de eventbeheerder manueel kan beslissen welke
      correct is. Geen crash — bestaand Contact blijft actief.

      BINDING: dit channel gebruikt een fanout exchange (geen named queue).
      Controlroom en Frontend moeten elk een eigen queue aanmaken en die binden
      aan de exchange 'crm.user.conflict'. Voorbeeld (RabbitMQ Management UI of
      code): channel.queue_declare(queue='controlroom.user.conflict'),
      channel.queue_bind(exchange='crm.user.conflict',
      queue='controlroom.user.conflict'). Zonder binding ontvangen consumers
      geen berichten.
    messages:
      userConflict:
        $ref: "#/components/messages/UserConflict"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: crm.user.conflict
          type: fanout
          durable: true

  # ============================================================
  # KASSA → CRM (betaling — toegevoegd v1.3.0)
  # ============================================================

  kassaPaymentConfirmed:
    address: kassa.payment.confirmed
    description: >-
      Contract 16 — Kassa → CRM: betaling bevestigd aan de inkom (US-08, US-21 |
      R1). CRM werkt betalingsstatus bij op de juiste sessie-inschrijving in
      Salesforce en synchroniseert Contact.Paid_At__c als compatibiliteitsveld
      zonder die waarde achteruit te laten gaan bij out-of-order events.
      Zonder dit contract weet CRM nooit dat een deelnemer betaald heeft.
    messages:
      paymentConfirmed:
        $ref: "#/components/messages/PaymentConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # KASSA → CRM (lijst niet-betaalden — toegevoegd v1.3.0)
  # ============================================================

  kassaUnpaidRequested:
    address: kassa.unpaid.requested
    description: >-
      Contract 17 (request) — Kassa → CRM: lijst van niet-betaalde deelnemers
      opvragen (US-07 | R1). PersonLookup (Contract 10) werkt per persoon —
      voor een overzichtslijst is dit apart contract nodig.
    messages:
      unpaidRequest:
        $ref: "#/components/messages/UnpaidRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmUnpaidResponded:
    address: crm.unpaid.responded
    description: >-
      Contract 17 (response) — CRM → Kassa: lijst van niet-betaalde deelnemers
      (US-07 | R1).
    messages:
      unpaidResponse:
        $ref: "#/components/messages/UnpaidResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CRM → ALLE CONSUMERS (updates — toegevoegd v1.3.0)
  # ============================================================

  crmUserUpdated:
    address: crm.user.updated
    description: >-
      Contract 18 — CRM → alle consumers: Contact gewijzigd in Salesforce
      (US-21, US-41 | R2). Getriggerd bij elke update van een Contact: naam,
      adres, bedrijfskoppeling, rol. Consumers updaten hun lokale kopie.
      Bevat altijd het volledige object — geen partial updates.
    messages:
      userUpdated:
        $ref: "#/components/messages/UserUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyUpdated:
    address: crm.company.updated
    description: >-
      Contract 19 — CRM → alle consumers: Account gewijzigd in Salesforce
      (US-41 | R2). Facturatie heeft het bijgewerkte adres nodig voor correcte
      facturen. Bevat altijd het volledige object — geen partial updates.
    messages:
      companyUpdated:
        $ref: "#/components/messages/CompanyUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # MAILING → CRM (bounce — toegevoegd v1.3.0)
  # ============================================================

  mailingBounceReported:
    address: mailing.bounce.reported
    description: >-
      Contract 20 — Mailing → CRM: e-mailbounce gerapporteerd door SendGrid
      (US-39 | R2). CRM markeert het e-mailadres als onbereikbaar op het
      Contact in Salesforce. Zonder dit contract mist US-39 de databron om
      te bepalen wie de mail niet ontvangen heeft.
    messages:
      bounceReported:
        $ref: "#/components/messages/BounceReported"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → FACTURATIE (factuurverzoek privépersoon — toegevoegd v1.3.0)
  # ============================================================

  crmInvoiceRequested:
    address: crm.invoice.requested
    description: >-
      Contract 21 — CRM → Facturatie: factuurverzoek voor privépersoon (US-11 |
      R3). Getriggerd nadat een privépersoon adresgegevens heeft ingevuld en
      een factuur aanvraagt.

      PM-BESLISSING VEREIST: crm.user.updated alleen is niet voldoende want
      Facturatie moet het onderscheid kennen tussen een gewone adresupdate en
      een expliciete factuurverzoek. Dit event maakt dat onderscheid expliciet.

      Sad path: als Facturatie offline is, buffert CRM dit verzoek lokaal en
      herzendt zodra Facturatie terug online is.
    messages:
      invoiceRequested:
        $ref: "#/components/messages/InvoiceRequested"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → ALLE CONSUMERS (GDPR soft delete — toegevoegd v1.3.0)
  # ============================================================

  crmUserDeactivated:
    address: crm.user.deactivated
    description: >-
      Contract 22 — CRM → alle consumers: Contact gedeactiveerd in Salesforce
      (US-55 | R3). isActive=false — nooit fysiek verwijderen (GDPR audit trail).
      Kassa verwijdert de persoon uit de niet-betaalden lijst. Mailing verwijdert
      het adres uit mailinglijsten. Facturatie stopt met nieuwe posten voor
      deze persoon.
    messages:
      userDeactivated:
        $ref: "#/components/messages/UserDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyDeactivated:
    address: crm.company.deactivated
    description: >-
      Contract 23 — CRM → alle consumers: Account gedeactiveerd in Salesforce
      (US-54 | R3). isActive=false. Facturatie stopt met factureren voor dit
      bedrijf. Kassa koppelt geen nieuwe betalingen meer aan dit bedrijf.
    messages:
      companyDeactivated:
        $ref: "#/components/messages/CompanyDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

# ============================================================
# OPERATIONS
# ============================================================

operations:
  receiveRegistrationCreated:
    action: receive
    channel:
      $ref: "#/channels/frontendRegistrationCreated"
    messages:
      - $ref: "#/channels/frontendRegistrationCreated/messages/registrationCreated"
    summary: >-
      Ontvang nieuwe inschrijving van Frontend, dedupliceer op e-mail naar één
      canoniek Contact en bewaar daarnaast een sessie-inschrijving in
      Salesforce. Na bevestiging: publiceer crm.user.confirmed.
    tags:
      - name: frontend
      - name: release-1

  receiveRegistrationChanged:
    action: receive
    channel:
      $ref: "#/channels/frontendRegistrationUpdated"
    messages:
      - $ref: "#/channels/frontendRegistrationUpdated/messages/registrationChanged"
    summary: >-
      Ontvang inschrijvingswijziging of annulering van Frontend. Updated werkt
      het Contact en de sessie-inschrijving bij; cancelled deactiveert eerst de
      sessie-inschrijving en valt voor legacy contacten zonder matchende
      sessierij alleen terug op Contact-deactivatie wanneer er ook geen andere
      actieve sessie-inschrijvingen of native producer-identiteit meer zijn.
    tags:
      - name: frontend
      - name: release-1
      - name: US-33
      - name: release-2-partial

  receiveCompanyCreated:
    action: receive
    channel:
      $ref: "#/channels/frontendCompanyCreated"
    messages:
      - $ref: "#/channels/frontendCompanyCreated/messages/companyCreated"
    summary: >-
      Ontvang nieuw bedrijf van Frontend en maak Account aan in Salesforce.
      Na bevestiging: publiceer crm.company.confirmed.
    tags:
      - name: frontend
      - name: release-1

  receiveFacturatieUserCreated:
    action: receive
    channel:
      $ref: "#/channels/facturatieUserCreated"
    messages:
      - $ref: "#/channels/facturatieUserCreated/messages/facturatieUserCreated"
    summary: >-
      Ontvang handmatig aangemaakte klant uit Facturatie, valideer voor
      Salesforce en publiceer daarna crm.user.confirmed met de CRM UUID.
      Bij een uniek bestaand Contact hergebruikt CRM dat Contact en kent zo nodig
      eerst een CRM UUID toe. Deze flow publiceert geen crm.mail.requested.
    tags:
      - name: facturatie
      - name: contract-24

  receiveFacturatieUserUpdated:
    action: receive
    channel:
      $ref: "#/channels/facturatieUserUpdated"
    messages:
      - $ref: "#/channels/facturatieUserUpdated/messages/facturatieUserUpdated"
    summary: >-
      Ontvang update van een CRM-linked user uit Facturatie, werk Contact in
      Salesforce bij en publiceer daarna crm.user.updated.
    tags:
      - name: facturatie
      - name: contract-25

  receiveFacturatieUserDeactivated:
    action: receive
    channel:
      $ref: "#/channels/facturatieUserDeactivated"
    messages:
      - $ref: "#/channels/facturatieUserDeactivated/messages/facturatieUserDeactivated"
    summary: >-
      Ontvang deactivatieverzoek uit Facturatie, voer enkel soft delete uit in
      Salesforce en publiceer daarna crm.user.deactivated.
    tags:
      - name: facturatie
      - name: contract-26

  receiveMailingUserCreated:
    action: receive
    channel:
      $ref: "#/channels/mailingUserCreated"
    messages:
      - $ref: "#/channels/mailingUserCreated/messages/mailingUserCreated"
    summary: >-
      Ontvang nieuw user-syncverzoek uit Mailing, valideer de payload en
      publiceer daarna crm.user.confirmed zodat consumers de officiële CRM UUID
      kennen. CRM bewaart tegelijk de native Mailing ID op het Contact en mag
      ontbrekende company-linkage, role en GDPR-state veilig aanvullen zolang
      geen expliciete GDPR opt-out of conflicterende bestaande rol aanwezig is.
    tags:
      - name: mailing
      - name: contract-27

  receiveMailingUserUpdated:
    action: receive
    channel:
      $ref: "#/channels/mailingUserUpdated"
    messages:
      - $ref: "#/channels/mailingUserUpdated/messages/mailingUserUpdated"
    summary: >-
      Ontvang volledig update-object uit Mailing, werk Contact in Salesforce bij
      en publiceer daarna crm.user.updated.
    tags:
      - name: mailing
      - name: contract-28

  receiveMailingUserDeactivated:
    action: receive
    channel:
      $ref: "#/channels/mailingUserDeactivated"
    messages:
      - $ref: "#/channels/mailingUserDeactivated/messages/mailingUserDeactivated"
    summary: >-
      Ontvang deactivatieverzoek uit Mailing, voer enkel soft delete uit in
      Salesforce en publiceer daarna crm.user.deactivated.
    tags:
      - name: mailing
      - name: contract-29

  receivePlanningUserCreated:
    action: receive
    channel:
      $ref: "#/channels/planningUserCreated"
    messages:
      - $ref: "#/channels/planningUserCreated/messages/planningUserCreated"
    summary: >-
      Ontvang Planning user sync create, valideer de payload en synchroniseer
      de Planning-user naar Salesforce op basis van de door Planning
      aangeleverde veldset.
    tags:
      - name: planning
      - name: contract-30

  receivePlanningUserUpdated:
    action: receive
    channel:
      $ref: "#/channels/planningUserUpdated"
    messages:
      - $ref: "#/channels/planningUserUpdated/messages/planningUserUpdated"
    summary: >-
      Ontvang volledig Planning update-object en werk de Planning-linked user
      in Salesforce bij.
    tags:
      - name: planning
      - name: contract-31

  receivePlanningUserDeactivated:
    action: receive
    channel:
      $ref: "#/channels/planningUserDeactivated"
    messages:
      - $ref: "#/channels/planningUserDeactivated/messages/planningUserDeactivated"
    summary: >-
      Ontvang Planning deactivatieverzoek en voer enkel soft delete uit in
      Salesforce.
    tags:
      - name: planning
      - name: contract-32

  receiveCompanyDataRequest:
    action: receive
    channel:
      $ref: "#/channels/facturatieCompanyRequested"
    messages:
      - $ref: "#/channels/facturatieCompanyRequested/messages/companyDataRequest"
    summary: Ontvang bedrijfsdataverzoek van Facturatie en stuur response terug
    reply:
      channel:
        $ref: "#/channels/crmCompanyResponded"
      messages:
        - $ref: "#/components/messages/CompanyDataResponse"
    tags:
      - name: facturatie
      - name: release-1

  sendMailRequest:
    action: send
    channel:
      $ref: "#/channels/crmMailRequested"
    messages:
      - $ref: "#/channels/crmMailRequested/messages/mailRequest"
    summary: >-
      Stuur mailverzoek naar Mailing. R1: registration_confirmation (US-03),
      bulk_event (US-22), session_change (US-23). R2: session_reminder (US-24).
    tags:
      - name: mailing
      - name: release-1

  sendHeartbeat:
    action: send
    channel:
      $ref: "#/channels/crmHeartbeat"
    messages:
      - $ref: "#/channels/crmHeartbeat/messages/heartbeat"
    summary: Publiceer heartbeat elke 1 seconde als bewijs dat CRM actief is
    tags:
      - name: controlroom
      - name: release-1

  sendStatusCheck:
    action: send
    channel:
      $ref: "#/channels/crmStatusChecked"
    messages:
      - $ref: "#/channels/crmStatusChecked/messages/statusCheck"
    summary: Stuur periodieke statuscheck met CPU-, geheugen- en schijfbelasting
    tags:
      - name: controlroom
      - name: release-1

  receiveWarning:
    action: receive
    channel:
      $ref: "#/channels/controlroomWarningIssued"
    messages:
      - $ref: "#/channels/controlroomWarningIssued/messages/warning"
    summary: Ontvang systeemwaarschuwing van Controlroom en log als error
    tags:
      - name: controlroom
      - name: release-1

  receivePersonLookup:
    action: receive
    channel:
      $ref: "#/channels/kassaPersonLookupRequested"
    messages:
      - $ref: "#/channels/kassaPersonLookupRequested/messages/personLookup"
    summary: Ontvang persoonscheck-verzoek van Kassa en stuur response terug inclusief UUID
    reply:
      channel:
        $ref: "#/channels/crmPersonLookupResponded"
      messages:
        - $ref: "#/components/messages/PersonResponse"
    tags:
      - name: kassa
      - name: release-1

  receiveSessionUpdate:
    action: receive
    channel:
      $ref: "#/channels/planningSessionUpdated"
    messages:
      - $ref: "#/channels/planningSessionUpdated/messages/sessionUpdate"
    summary: >-
      Ontvang sessiewijziging van Planning en notificeer betrokken deelnemers
      via Mailing (US-23) op basis van actieve sessie-inschrijvingen in
      Salesforce. Sprekernotificaties (US-38) zijn buiten scope voor CRM.
    tags:
      - name: planning
      - name: release-1

  receiveBadgeLink:
    action: receive
    channel:
      $ref: "#/channels/iotBadgeLinked"
    messages:
      - $ref: "#/channels/iotBadgeLinked/messages/badgeLink"
    summary: >-
      Ontvang badge-koppeling van IoT en sla badgeId op bij Contact in Salesforce
    tags:
      - name: iot
      - name: release-2

  sendUserConfirmed:
    action: send
    channel:
      $ref: "#/channels/crmUserConfirmed"
    messages:
      - $ref: "#/channels/crmUserConfirmed/messages/userConfirmed"
    summary: >-
      Publiceer bevestigd Contact met UUID na Salesforce-validatie. Getriggerd
      door receiveRegistrationCreated, receiveFacturatieUserCreated en
      receiveMailingUserCreated. E-mail is deduplicatiesleutel: exacte replays
      of veilige identifier-koppelingen mogen opnieuw bevestigen; alleen
      conflicterende bestaande data leiden tot sendUserConflict.
    tags:
      - name: frontend
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-1

  sendCompanyConfirmed:
    action: send
    channel:
      $ref: "#/channels/crmCompanyConfirmed"
    messages:
      - $ref: "#/channels/crmCompanyConfirmed/messages/companyConfirmed"
    summary: >-
      Publiceer bevestigd Account met UUID na Salesforce-verwerking. Getriggerd
      door receiveCompanyCreated. vatNumber is deduplicatiesleutel.
    tags:
      - name: facturatie
      - name: kassa
      - name: release-1

  sendUserConflict:
    action: send
    channel:
      $ref: "#/channels/crmUserConflict"
    messages:
      - $ref: "#/channels/crmUserConflict/messages/userConflict"
    summary: >-
      Publiceer conflictmelding wanneer een inschrijving binnenkomt met een
      e-mail die al bestaat in Salesforce met afwijkende gegevens. Controlroom
      logt, Frontend toont melding aan eventbeheerder.
    tags:
      - name: controlroom
      - name: frontend
      - name: release-2

  receivePaymentConfirmed:
    action: receive
    channel:
      $ref: "#/channels/kassaPaymentConfirmed"
    messages:
      - $ref: "#/channels/kassaPaymentConfirmed/messages/paymentConfirmed"
    summary: >-
      Ontvang betalingsbevestiging van Kassa en werk betalingsstatus bij op de
      juiste sessie-inschrijving in Salesforce; Contact.Paid_At__c blijft een
      compatibiliteitsafleiding die alleen naar de recentste betaalde timestamp
      mag vooruitgaan.
    tags:
      - name: kassa
      - name: release-1

  receiveUnpaidRequest:
    action: receive
    channel:
      $ref: "#/channels/kassaUnpaidRequested"
    messages:
      - $ref: "#/channels/kassaUnpaidRequested/messages/unpaidRequest"
    summary: >-
      Ontvang verzoek voor lijst niet-betaalde deelnemers en stuur response
      terug (US-07), gededupliceerd per canoniek Contact over actieve
      sessie-inschrijvingen heen.
    reply:
      channel:
        $ref: "#/channels/crmUnpaidResponded"
      messages:
        - $ref: "#/components/messages/UnpaidResponse"
    tags:
      - name: kassa
      - name: release-1

  sendUserUpdated:
    action: send
    channel:
      $ref: "#/channels/crmUserUpdated"
    messages:
      - $ref: "#/channels/crmUserUpdated/messages/userUpdated"
    summary: >-
      Publiceer volledig bijgewerkt Contact na update in Salesforce (US-21,
      US-41) vanuit Frontend-, Facturatie- of Mailing-sync. Consumers updaten
      hun lokale kopie.
    tags:
      - name: frontend
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-2

  sendCompanyUpdated:
    action: send
    channel:
      $ref: "#/channels/crmCompanyUpdated"
    messages:
      - $ref: "#/channels/crmCompanyUpdated/messages/companyUpdated"
    summary: >-
      Publiceer volledig bijgewerkt Account na update in Salesforce (US-41).
      Facturatie gebruikt bijgewerkt adres voor facturen.
    tags:
      - name: facturatie
      - name: release-2

  receiveBounceReported:
    action: receive
    channel:
      $ref: "#/channels/mailingBounceReported"
    messages:
      - $ref: "#/channels/mailingBounceReported/messages/bounceReported"
    summary: >-
      Ontvang bouncerapport van Mailing en markeer e-mailadres als onbereikbaar
      op Contact in Salesforce (US-39).
    tags:
      - name: mailing
      - name: release-2

  sendInvoiceRequested:
    action: send
    channel:
      $ref: "#/channels/crmInvoiceRequested"
    messages:
      - $ref: "#/channels/crmInvoiceRequested/messages/invoiceRequested"
    summary: >-
      Publiceer factuurverzoek naar Facturatie nadat privépersoon adres heeft
      ingevuld (US-11). Onderscheidt een factuurverzoek van een gewone
      adresupdate.
    tags:
      - name: facturatie
      - name: release-3

  sendUserDeactivated:
    action: send
    channel:
      $ref: "#/channels/crmUserDeactivated"
    messages:
      - $ref: "#/channels/crmUserDeactivated/messages/userDeactivated"
    summary: >-
      Publiceer deactivatie van Contact na Frontend-cancellation,
      Facturatie-sync, Mailing-sync of GDPR-verwijderverzoek (US-55).
      isActive=false — geen fysieke verwijdering.
    tags:
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-3

  sendCompanyDeactivated:
    action: send
    channel:
      $ref: "#/channels/crmCompanyDeactivated"
    messages:
      - $ref: "#/channels/crmCompanyDeactivated/messages/companyDeactivated"
    summary: >-
      Publiceer deactivatie van Account (US-54). Consumers stoppen met
      verwerking voor dit bedrijf.
    tags:
      - name: facturatie
      - name: kassa
      - name: release-3

# ============================================================
# COMPONENTS
# ============================================================

components:
  messages:
    RegistrationCreated:
      name: RegistrationCreated
      title: Nieuwe inschrijving
      summary: Frontend meldt een nieuwe inschrijving voor een sessie
      contentType: application/xml
      tags:
        - name: US-02
        - name: US-03
        - name: US-04
        - name: US-05
        - name: US-19
      payload:
        $ref: "#/components/schemas/RegistrationCreated"
      examples:
        - name: individueel
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Registration>
              <registrationId>REG-20260415-001</registrationId>
              <firstName>Jan</firstName>
              <lastName>Janssen</lastName>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <role>VISITOR</role>
              <gdprConsent>true</gdprConsent>
              <phone>+32471234567</phone>
            </Registration>
        - name: met_bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Registration>
              <registrationId>REG-20260415-002</registrationId>
              <firstName>Lien</firstName>
              <lastName>Vermeersch</lastName>
              <email>lien.vermeersch@techbedrijf.be</email>
              <sessionId>SESSION-001</sessionId>
              <role>COMPANY_CONTACT</role>
              <gdprConsent>true</gdprConsent>
              <company>Bedrijf NV</company>
            </Registration>

    RegistrationChanged:
      name: RegistrationChanged
      title: Inschrijvingswijziging of annulering
      contentType: application/xml
      tags:
        - name: US-21
        - name: US-33
      payload:
        $ref: "#/components/schemas/RegistrationChanged"
      examples:
        - name: update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <RegistrationChange>
              <registrationId>REG-20260415-001</registrationId>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <changeType>updated</changeType>
              <updatedFields>
                <firstName>Johan</firstName>
              </updatedFields>
            </RegistrationChange>
        - name: annulering
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <RegistrationChange>
              <registrationId>REG-20260415-001</registrationId>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <changeType>cancelled</changeType>
            </RegistrationChange>

    FacturatieUserCreated:
      name: FacturatieUserCreated
      title: Facturatie user aangemaakt
      summary: >-
        Facturatie meldt een handmatig aangemaakte klant zodat CRM een Contact
        in Salesforce kan aanmaken en een CRM UUID kan toekennen.
        Bij een uniek bestaand Contact hergebruikt CRM dat Contact en kent zo nodig
        eerst een CRM UUID toe. Deze flow publiceert geen crm.mail.requested.
      contentType: application/xml
      tags:
        - name: facturatie
        - name: contract-24
      payload:
        $ref: "#/components/schemas/FacturatieUserCreated"
      examples:
        - name: handmatige_klant
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <UserCreated>
              <facturatieCustomerId>FB-1024</facturatieCustomerId>
              <registrationId>REG-20260415-010</registrationId>
              <firstName>Els</firstName>
              <lastName>Peeters</lastName>
              <email>els.peeters@example.com</email>
              <phone>+32470111222</phone>
              <role>COMPANY_CONTACT</role>
              <companyId>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</companyId>
              <isActive>true</isActive>
              <createdAt>2026-04-15T09:30:00Z</createdAt>
            </UserCreated>

    FacturatieUserUpdated:
      name: FacturatieUserUpdated
      title: Facturatie user bijgewerkt
      summary: >-
        Facturatie stuurt een volledig update-object voor een reeds aan CRM
        gekoppelde user.
      contentType: application/xml
      tags:
        - name: facturatie
        - name: contract-25
      payload:
        $ref: "#/components/schemas/FacturatieUserUpdated"
      examples:
        - name: adreswijziging
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <UserUpdated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>els.peeters@example.com</email>
              <firstName>Els</firstName>
              <lastName>Peeters</lastName>
              <phone>+32470111222</phone>
              <street>Stationsstraat</street>
              <houseNumber>12B</houseNumber>
              <postalCode>9000</postalCode>
              <city>Gent</city>
              <country>BE</country>
              <role>COMPANY_CONTACT</role>
              <companyId>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</companyId>
              <isActive>true</isActive>
              <gdprConsent>true</gdprConsent>
              <updatedAt>2026-04-15T10:15:00Z</updatedAt>
            </UserUpdated>

    FacturatieUserDeactivated:
      name: FacturatieUserDeactivated
      title: Facturatie user gedeactiveerd
      summary: >-
        Facturatie vraagt CRM om een bestaande CRM-linked user soft te
        deactiveren.
      contentType: application/xml
      tags:
        - name: facturatie
        - name: contract-26
      payload:
        $ref: "#/components/schemas/FacturatieUserDeactivated"
      examples:
        - name: deactivatie
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <UserDeactivated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>els.peeters@example.com</email>
              <deactivatedAt>2026-04-15T16:00:00Z</deactivatedAt>
            </UserDeactivated>

    MailingUserCreated:
      name: MailingUserCreated
      title: Mailing user aangemaakt
      summary: >-
        Mailing vraagt CRM om een nieuwe user uit de eigen databank te
        synchroniseren naar Salesforce. CRM bewaart de native Mailing-ID op het
        Contact en bevestigt daarna met crm.user.confirmed zodat consumers de
        officiële CRM UUID kennen.
      contentType: application/xml
      tags:
        - name: mailing
        - name: contract-27
      payload:
        $ref: "#/components/schemas/MailingUserCreated"
      examples:
        - name: mailing_create
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <MailingUserCreated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>els.peeters@example.com</email>
              <firstName>Els</firstName>
              <lastName>Peeters</lastName>
              <isActive>true</isActive>
              <companyId>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</companyId>
            </MailingUserCreated>

    MailingUserUpdated:
      name: MailingUserUpdated
      title: Mailing user bijgewerkt
      summary: >-
        Mailing stuurt een volledig update-object voor een user die al in CRM
        gekend is. Het `<id>`-veld bevat de CRM master UUID die Mailing in
        `crm.user.confirmed` heeft ontvangen (Option 2 UUID-strategie); CRM
        zoekt het Contact strict op `CRM_ID__c`.
      contentType: application/xml
      tags:
        - name: mailing
        - name: contract-28
      payload:
        $ref: "#/components/schemas/MailingUserUpdated"
      examples:
        - name: mailing_update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <MailingUserUpdated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>els.peeters@example.com</email>
              <firstName>Elise</firstName>
              <lastName>Peeters</lastName>
              <isActive>true</isActive>
              <companyId>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</companyId>
            </MailingUserUpdated>

    MailingUserDeactivated:
      name: MailingUserDeactivated
      title: Mailing user gedeactiveerd
      summary: >-
        Mailing vraagt CRM om een bestaande user soft te deactiveren zodat de
        CRM master data en mailinglijsten GDPR-consistent blijven. Het
        `<id>`-veld bevat de CRM master UUID die Mailing in `crm.user.confirmed`
        heeft ontvangen (Option 2 UUID-strategie); CRM zoekt het Contact
        strict op `CRM_ID__c`.
      contentType: application/xml
      tags:
        - name: mailing
        - name: contract-29
      payload:
        $ref: "#/components/schemas/MailingUserDeactivated"
      examples:
        - name: mailing_deactivatie
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <MailingUserDeactivated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>els.peeters@example.com</email>
              <deactivatedAt>2026-04-15T16:00:00Z</deactivatedAt>
            </MailingUserDeactivated>

    PlanningUserCreated:
      name: PlanningUserCreated
      title: Planning user aangemaakt
      summary: >-
        Planning vraagt CRM om een lokale Planning-user naar Salesforce te
        synchroniseren. CRM gebruikt lokale contractnummering 30, met Planning
        referentie 21.
      contentType: application/xml
      tags:
        - name: planning
        - name: contract-30
      payload:
        $ref: "#/components/schemas/PlanningUserCreated"
      examples:
        - name: planning_create
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <PlanningUserCreated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>sofie.declercq@example.com</email>
              <firstName>Sofie</firstName>
              <lastName>Declercq</lastName>
              <role>SPEAKER</role>
              <gdprConsent>true</gdprConsent>
              <phoneNumber>+32470123456</phoneNumber>
              <company>Desideriushogeschool</company>
            </PlanningUserCreated>

    PlanningUserUpdated:
      name: PlanningUserUpdated
      title: Planning user bijgewerkt
      summary: >-
        Planning stuurt een volledig update-object voor een user die ook in CRM
        gekend moet blijven. CRM gebruikt lokale contractnummering 31, met
        Planning referentie 22.
      contentType: application/xml
      tags:
        - name: planning
        - name: contract-31
      payload:
        $ref: "#/components/schemas/PlanningUserUpdated"
      examples:
        - name: planning_update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <PlanningUserUpdated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>sofie.declercq@example.com</email>
              <firstName>Sofie</firstName>
              <lastName>De Clercq</lastName>
              <role>VISITOR</role>
              <gdprConsent>true</gdprConsent>
              <phoneNumber>+32470999888</phoneNumber>
              <company>Desideriushogeschool</company>
            </PlanningUserUpdated>

    PlanningUserDeactivated:
      name: PlanningUserDeactivated
      title: Planning user gedeactiveerd
      summary: >-
        Planning vraagt CRM om een bestaande user soft te deactiveren. CRM
        gebruikt lokale contractnummering 32, met Planning referentie 23.
      contentType: application/xml
      tags:
        - name: planning
        - name: contract-32
      payload:
        $ref: "#/components/schemas/PlanningUserDeactivated"
      examples:
        - name: planning_deactivatie
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <PlanningUserDeactivated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>sofie.declercq@example.com</email>
              <deactivatedAt>2026-04-15T16:00:00Z</deactivatedAt>
            </PlanningUserDeactivated>

    CompanyCreated:
      name: CompanyCreated
      title: Nieuw bedrijf aanmaken
      contentType: application/xml
      tags:
        - name: US-40
        - name: US-20
      payload:
        $ref: "#/components/schemas/CompanyCreated"
      examples:
        - name: bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <CompanyCreated>
              <name>Bedrijf NV</name>
              <vatNumber>BE0123456789</vatNumber>
              <email>info@bedrijf.be</email>
              <phone>+32 2 123 45 67</phone>
              <street>Hoofdstraat</street>
              <houseNumber>1</houseNumber>
              <postalCode>1000</postalCode>
              <city>Brussel</city>
              <country>BE</country>
            </CompanyCreated>

    CompanyUpdated:
      name: CompanyUpdated
      title: Bedrijfsgegevens (volledig object — CRM broadcast)
      summary: >-
        Volledig bijgewerkt Account uit Salesforce. Consumers vervangen hun
        lokale kopie volledig — geen partial merge.
      contentType: application/xml
      tags:
        - name: US-41
      payload:
        $ref: "#/components/schemas/CompanyUpdatedBroadcast"
      examples:
        - name: update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <CompanyUpdated>
              <id>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</id>
              <vatNumber>BE0123456789</vatNumber>
              <name>Nieuw Bedrijf NV</name>
              <email>nieuw@bedrijf.be</email>
              <phone>+32 3 987 65 43</phone>
