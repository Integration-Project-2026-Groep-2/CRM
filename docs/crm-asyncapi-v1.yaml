asyncapi: 3.0.0

info:
  title: Integratieproject 2026 — CRM (Salesforce) RabbitMQ Contracts
  version: 1.0.0
  description: |
    XML-contracten voor alle 12 integraties waarbij het CRM-team (Salesforce) betrokken is.
    Elk contract legt vast wie naar wie stuurt, via welke queue en in welk XML-formaat.
    Queue-namen zijn voorstellen — nog te bevestigen met de betrokken teams, tenzij anders vermeld.
    Alle berichten zijn XML-formaat (projectbrede afspraak, bevestigd door PMs).
  contact:
    name: Lars Cowé — CRM Team Lead
    email: lars.cowe@student.ehb.be

servers:
  production:
    host: integrationproject-2526s2-dag02.westeurope.cloudapp.azure.com:5672
    protocol: amqp
    description: "Azure VM — RabbitMQ broker (Infra team). Poort 5672 nog niet bevestigd open (zie infra-vm.md). RabbitMQ credentials pending bij Infra."
    security:
      - $ref: '#/components/securitySchemes/rabbitmq'

defaultContentType: application/xml

channels:

  # ─── CONTRACT 1 ─────────────────────────────────────────────────────────────
  frontendRegistrationCreated:
    address: frontend.registration.created
    description: "Contract 1 — Frontend → CRM: nieuwe inschrijving aanmaken (US-02, US-04, US-05, US-19 | R1)"
    messages:
      registrationCreated:
        $ref: '#/components/messages/RegistrationCreated'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 2 ─────────────────────────────────────────────────────────────
  frontendRegistrationUpdated:
    address: frontend.registration.updated
    description: "Contract 2 — Frontend → CRM: inschrijving wijzigen of annuleren (US-21 R1, US-33 R2)"
    messages:
      registrationChanged:
        $ref: '#/components/messages/RegistrationChanged'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 3 ─────────────────────────────────────────────────────────────
  facturatieCompanyCreated:
    address: facturatie.company.created
    description: "Contract 3 — Facturatie → CRM: nieuw bedrijf aanmaken als Account in Salesforce (US-40, US-20 | R1)"
    messages:
      companyCreated:
        $ref: '#/components/messages/CompanyCreated'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 4 ─────────────────────────────────────────────────────────────
  facturatieCompanyUpdated:
    address: facturatie.company.updated
    description: "Contract 4 — Facturatie → CRM: bedrijfsgegevens updaten (US-41 | R2)"
    messages:
      companyUpdated:
        $ref: '#/components/messages/CompanyUpdated'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 5 (request-response) ──────────────────────────────────────────
  facturatieCompanyRequested:
    address: facturatie.company.requested
    description: "Contract 5 (request) — Facturatie → CRM: bedrijfsdata opvragen via vatNumber (US-40, US-20 | R1)"
    messages:
      companyDataRequest:
        $ref: '#/components/messages/CompanyDataRequest'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyResponded:
    address: crm.company.responded
    description: "Contract 5 (response) — CRM → Facturatie: bedrijfsdata terugsturen (US-40, US-20 | R1)"
    messages:
      companyDataResponse:
        $ref: '#/components/messages/CompanyDataResponse'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ─── CONTRACT 6 ─────────────────────────────────────────────────────────────
  crmMailRequested:
    address: crm.mail.requested
    description: "Contract 6 — CRM → Mailing: deelnemersnotificatie via SendGrid (US-22, US-23 | R1)"
    messages:
      mailRequest:
        $ref: '#/components/messages/MailRequest'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 7 ─────────────────────────────────────────────────────────────
  crmHeartbeat:
    address: crm.heartbeat
    description: "Contract 7 — CRM → Controlroom: heartbeat elke 1 seconde (US-25, US-26 | R1)"
    messages:
      heartbeat:
        $ref: '#/components/messages/Heartbeat'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ─── CONTRACT 8 ─────────────────────────────────────────────────────────────
  crmStatusChecked:
    address: crm.status.checked
    description: "Contract 8 — CRM → Controlroom: periodieke statuscheck met systeemmetrieken (US-25 | R1)"
    messages:
      statusCheck:
        $ref: '#/components/messages/StatusCheck'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ─── CONTRACT 9 ─────────────────────────────────────────────────────────────
  controlroomWarningIssued:
    address: controlroom.warning.issued
    description: "Contract 9 — Controlroom → CRM: systeemwaarschuwing bij anomalie (US-26 | R1)"
    messages:
      warning:
        $ref: '#/components/messages/Warning'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ─── CONTRACT 10 (request-response) ─────────────────────────────────────────
  kassaPersonLookupRequested:
    address: kassa.person.lookup_requested
    description: "Contract 10 (request) — Kassa → CRM: persoonscheck op basis van e-mail (US-47 | R1)"
    messages:
      personLookup:
        $ref: '#/components/messages/PersonLookup'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmPersonLookupResponded:
    address: crm.person.lookup_responded
    description: "Contract 10 (response) — CRM → Kassa: resultaat persoonscheck (US-47 | R1)"
    messages:
      personResponse:
        $ref: '#/components/messages/PersonResponse'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ─── CONTRACT 11 ─────────────────────────────────────────────────────────────
  planningSessionUpdated:
    address: planning.session.updated
    description: "Contract 11 — Planning → CRM: sessiewijziging (US-23 R1, US-38 R3)"
    messages:
      sessionUpdate:
        $ref: '#/components/messages/SessionUpdate'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ─── CONTRACT 12 ─────────────────────────────────────────────────────────────
  iotBadgeLinked:
    address: iot.badge.linked
    description: "Contract 12 — IoT → CRM: badge koppelen aan bezoeker via Raspberry Pi (US-28, US-29 | R2)"
    messages:
      badgeLink:
        $ref: '#/components/messages/BadgeLink'
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

# ─── OPERATIONS ────────────────────────────────────────────────────────────────
operations:

  receiveRegistrationCreated:
    action: receive
    channel:
      $ref: '#/channels/frontendRegistrationCreated'
    summary: Ontvang nieuwe inschrijving van Frontend en sla op als Contact in Salesforce
    tags:
      - name: frontend
      - name: release-1

  receiveRegistrationChanged:
    action: receive
    channel:
      $ref: '#/channels/frontendRegistrationUpdated'
    summary: Ontvang inschrijvingswijziging of annulering van Frontend
    tags:
      - name: frontend
      - name: release-1

  receiveCompanyCreated:
    action: receive
    channel:
      $ref: '#/channels/facturatieCompanyCreated'
    summary: Ontvang nieuw bedrijf van Facturatie en maak Account aan in Salesforce
    tags:
      - name: facturatie
      - name: release-1

  receiveCompanyUpdated:
    action: receive
    channel:
      $ref: '#/channels/facturatieCompanyUpdated'
    summary: Ontvang bedrijfsupdate van Facturatie en pas Account aan in Salesforce
    tags:
      - name: facturatie
      - name: release-2

  receiveCompanyDataRequest:
    action: receive
    channel:
      $ref: '#/channels/facturatieCompanyRequested'
    summary: Ontvang bedrijfsdataverzoek van Facturatie en stuur response terug
    reply:
      channel:
        $ref: '#/channels/crmCompanyResponded'
      messages:
        - $ref: '#/channels/crmCompanyResponded/messages/companyDataResponse'
    tags:
      - name: facturatie
      - name: release-1

  sendMailRequest:
    action: send
    channel:
      $ref: '#/channels/crmMailRequested'
    summary: Stuur mailverzoek naar Mailing voor deelnemersnotificatie of sessiewijziging
    tags:
      - name: mailing
      - name: release-1

  sendHeartbeat:
    action: send
    channel:
      $ref: '#/channels/crmHeartbeat'
    summary: Publiceer heartbeat elke 1 seconde als bewijs dat CRM actief is
    tags:
      - name: controlroom
      - name: release-1

  sendStatusCheck:
    action: send
    channel:
      $ref: '#/channels/crmStatusChecked'
    summary: Stuur periodieke statuscheck met CPU-, geheugen- en schijfbelasting
    tags:
      - name: controlroom
      - name: release-1

  receiveWarning:
    action: receive
    channel:
      $ref: '#/channels/controlroomWarningIssued'
    summary: Ontvang systeemwaarschuwing van Controlroom en log als error
    tags:
      - name: controlroom
      - name: release-1

  receivePersonLookup:
    action: receive
    channel:
      $ref: '#/channels/kassaPersonLookupRequested'
    summary: Ontvang persoonscheck-verzoek van Kassa en stuur response terug
    reply:
      channel:
        $ref: '#/channels/crmPersonLookupResponded'
      messages:
        - $ref: '#/channels/crmPersonLookupResponded/messages/personResponse'
    tags:
      - name: kassa
      - name: release-1

  receiveSessionUpdate:
    action: receive
    channel:
      $ref: '#/channels/planningSessionUpdated'
    summary: Ontvang sessiewijziging van Planning en notificeer betrokken deelnemers via Mailing
    tags:
      - name: planning
      - name: release-1

  receiveBadgeLink:
    action: receive
    channel:
      $ref: '#/channels/iotBadgeLinked'
    summary: Ontvang badge-koppeling van IoT en sla badgeId op bij Contact in Salesforce
    tags:
      - name: iot
      - name: release-2

# ─── COMPONENTS ────────────────────────────────────────────────────────────────
components:

  messages:

    RegistrationCreated:
      name: RegistrationCreated
      title: Nieuwe inschrijving
      summary: Frontend meldt een nieuwe inschrijving voor een sessie
      contentType: application/xml
      tags:
        - name: "US-02"
        - name: "US-04"
        - name: "US-05"
        - name: "US-19"
      payload:
        $ref: '#/components/schemas/RegistrationCreated'
      examples:
        - name: individueel
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <registration>
              <firstName>Jan</firstName>
              <lastName>Janssen</lastName>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
            </registration>
        - name: met_bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <registration>
              <firstName>Jan</firstName>
              <lastName>Janssen</lastName>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <company>Bedrijf NV</company>
            </registration>

    RegistrationChanged:
      name: RegistrationChanged
      title: Inschrijvingswijziging of annulering
      contentType: application/xml
      tags:
        - name: "US-21"
        - name: "US-33"
      payload:
        $ref: '#/components/schemas/RegistrationChanged'
      examples:
        - name: update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <registration_change>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <changeType>updated</changeType>
              <updatedFields>
                <firstName>Johan</firstName>
              </updatedFields>
            </registration_change>
        - name: annulering
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <registration_change>
              <email>jan.janssen@example.com</email>
              <sessionId>SESSION-001</sessionId>
              <changeType>cancelled</changeType>
            </registration_change>

    CompanyCreated:
      name: CompanyCreated
      title: Nieuw bedrijf aanmaken
      contentType: application/xml
      tags:
        - name: "US-40"
        - name: "US-20"
      payload:
        $ref: '#/components/schemas/CompanyCreated'
      examples:
        - name: bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_created>
              <name>Bedrijf NV</name>
              <vatNumber>BE0123456789</vatNumber>
              <email>info@bedrijf.be</email>
              <phone>+32 2 123 45 67</phone>
              <address>Hoofdstraat 1, 1000 Brussel</address>
            </company_created>

    CompanyUpdated:
      name: CompanyUpdated
      title: Bedrijfsgegevens updaten
      contentType: application/xml
      tags:
        - name: "US-41"
      payload:
        $ref: '#/components/schemas/CompanyUpdated'
      examples:
        - name: naam_update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_updated>
              <vatNumber>BE0123456789</vatNumber>
              <updatedFields>
                <name>Nieuw Bedrijf NV</name>
              </updatedFields>
            </company_updated>
        - name: volledig_update
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_updated>
              <vatNumber>BE0123456789</vatNumber>
              <updatedFields>
                <name>Nieuw Bedrijf NV</name>
                <email>nieuw@bedrijf.be</email>
                <address>Nieuwstraat 5, 2000 Antwerpen</address>
              </updatedFields>
            </company_updated>

    CompanyDataRequest:
      name: CompanyDataRequest
      title: Bedrijfsdata opvragen
      contentType: application/xml
      tags:
        - name: "US-40"
        - name: "US-20"
      payload:
        $ref: '#/components/schemas/CompanyDataRequest'
      examples:
        - name: request
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_request>
              <requestId>REQ-001</requestId>
              <vatNumber>BE0123456789</vatNumber>
            </company_request>

    CompanyDataResponse:
      name: CompanyDataResponse
      title: Bedrijfsdata response
      contentType: application/xml
      tags:
        - name: "US-40"
        - name: "US-20"
      payload:
        $ref: '#/components/schemas/CompanyDataResponse'
      examples:
        - name: gevonden
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_response>
              <requestId>REQ-001</requestId>
              <name>Bedrijf NV</name>
              <vatNumber>BE0123456789</vatNumber>
              <email>info@bedrijf.be</email>
              <address>Hoofdstraat 1, 1000 Brussel</address>
            </company_response>
        - name: niet_gevonden
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_response>
              <requestId>REQ-001</requestId>
            </company_response>

    MailRequest:
      name: MailRequest
      title: Mailverzoek naar Mailing
      summary: CRM stuurt per ontvanger een apart bericht — geen lijsten in één XML
      contentType: application/xml
      tags:
        - name: "US-22"
        - name: "US-23"
      payload:
        $ref: '#/components/schemas/MailRequest'
      examples:
        - name: sessiebevestiging
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <mail_request>
              <header>
                <source>CRM</source>
                <timestamp>2026-03-14T10:00:00Z</timestamp>
              </header>
              <recipient>
                <email>jan.janssen@example.com</email>
                <name>Jan Janssen</name>
              </recipient>
              <dynamic_data>
                <guest_name>Jan Janssen</guest_name>
                <session_name>Workshop AI</session_name>
                <session_time>2026-04-15T14:00:00Z</session_time>
                <session_location>Zaal A</session_location>
              </dynamic_data>
            </mail_request>

    Heartbeat:
      name: Heartbeat
      title: CRM heartbeat
      summary: Elke seconde gepubliceerd — Controlroom alarmeert als signaal uitblijft
      contentType: application/xml
      tags:
        - name: "US-25"
        - name: "US-26"
      payload:
        $ref: '#/components/schemas/Heartbeat'
      examples:
        - name: heartbeat
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Heartbeat>
              <serviceId>CRM</serviceId>
              <timestamp>2026-03-14T10:00:00Z</timestamp>
            </Heartbeat>

    StatusCheck:
      name: StatusCheck
      title: CRM statuscheck
      summary: Uitgebreider dan heartbeat — bevat CPU, memory en disk
      contentType: application/xml
      tags:
        - name: "US-25"
      payload:
        $ref: '#/components/schemas/StatusCheck'
      examples:
        - name: healthy
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <StatusCheck>
              <serviceId>CRM</serviceId>
              <timestamp>2026-03-14T10:00:00Z</timestamp>
              <status>healthy</status>
              <uptime>3600</uptime>
              <systemLoad>
                <cpu>0.23</cpu>
                <memory>0.41</memory>
                <disk>0.15</disk>
              </systemLoad>
            </StatusCheck>
        - name: degraded
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <StatusCheck>
              <serviceId>CRM</serviceId>
              <timestamp>2026-03-14T10:00:00Z</timestamp>
              <status>degraded</status>
              <uptime>3600</uptime>
              <systemLoad>
                <cpu>0.91</cpu>
                <memory>0.85</memory>
                <disk>0.60</disk>
              </systemLoad>
            </StatusCheck>

    Warning:
      name: Warning
      title: Systeemwaarschuwing van Controlroom
      summary: Controlroom detecteerde anomalie — CRM logt als error, geen crash
      contentType: application/xml
      tags:
        - name: "US-26"
      payload:
        $ref: '#/components/schemas/Warning'
      examples:
        - name: heartbeat_warning
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Warning>
              <serviceId>CRM</serviceId>
              <message>Duplicate heartbeat detected</message>
              <type>heartbeat</type>
            </Warning>
        - name: statuscheck_warning
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <Warning>
              <serviceId>CRM</serviceId>
              <message>StatusCheck interval exceeded</message>
              <type>statusCheck</type>
            </Warning>

    PersonLookup:
      name: PersonLookup
      title: Persoonscheck verzoek van Kassa
      contentType: application/xml
      tags:
        - name: "US-47"
      payload:
        $ref: '#/components/schemas/PersonLookup'
      examples:
        - name: lookup
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <person_lookup>
              <requestId>LOOKUP-001</requestId>
              <email>jan.janssen@example.com</email>
            </person_lookup>

    PersonResponse:
      name: PersonResponse
      title: Persoonscheck response van CRM
      contentType: application/xml
      tags:
        - name: "US-47"
      payload:
        $ref: '#/components/schemas/PersonResponse'
      examples:
        - name: gevonden_met_bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <person_response>
              <requestId>LOOKUP-001</requestId>
              <found>true</found>
              <linkedToCompany>true</linkedToCompany>
              <companyName>Bedrijf NV</companyName>
            </person_response>
        - name: gevonden_zonder_bedrijf
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <person_response>
              <requestId>LOOKUP-001</requestId>
              <found>true</found>
              <linkedToCompany>false</linkedToCompany>
            </person_response>
        - name: niet_gevonden
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <person_response>
              <requestId>LOOKUP-001</requestId>
              <found>false</found>
              <linkedToCompany>false</linkedToCompany>
            </person_response>

    SessionUpdate:
      name: SessionUpdate
      title: Sessiewijziging van Planning
      contentType: application/xml
      tags:
        - name: "US-23"
        - name: "US-38"
      payload:
        $ref: '#/components/schemas/SessionUpdate'
      examples:
        - name: verzet
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <session_update>
              <sessionId>SESSION-001</sessionId>
              <sessionName>Workshop AI</sessionName>
              <newTime>2026-04-15T15:00:00Z</newTime>
              <newLocation>Zaal B</newLocation>
              <changeType>rescheduled</changeType>
            </session_update>
        - name: geannuleerd
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <session_update>
              <sessionId>SESSION-001</sessionId>
              <sessionName>Workshop AI</sessionName>
              <newTime>2026-04-15T15:00:00Z</newTime>
              <changeType>cancelled</changeType>
            </session_update>

    BadgeLink:
      name: BadgeLink
      title: Badge koppelen aan bezoeker
      summary: IoT stuurt badge-ID + e-mail — CRM slaat koppeling op bij Contact in Salesforce
      contentType: application/xml
      tags:
        - name: "US-28"
        - name: "US-29"
      payload:
        $ref: '#/components/schemas/BadgeLink'
      examples:
        - name: koppeling
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <badge_link>
              <badgeId>BADGE-12345</badgeId>
              <contactEmail>jan.janssen@example.com</contactEmail>
              <linkedAt>2026-04-15T09:00:00Z</linkedAt>
            </badge_link>

  schemas:
    # AsyncAPI ondersteunt geen native XSD — schemas worden gedocumenteerd als
    # type: string / format: xml. Validatie tegen XSD gebeurt in de implementatie
    # via lxml (zie crm-technical-stack.md). XSD-schemas staan in de Git repo.

    RegistrationCreated:
      type: string
      format: xml
      description: |
        Verplicht: firstName, lastName, email (RFC 5322), sessionId
        Optioneel: company (niet leeg indien aanwezig)

    RegistrationChanged:
      type: string
      format: xml
      description: |
        Verplicht: email, sessionId, changeType (updated | cancelled)
        Optioneel: updatedFields (alleen bij updated)
        Bij cancelled: Contact deactiveren — geen verwijdering (US-55 GDPR = R3)
        US-46 (offline buffering R3): zelfde queue, lokale buffer in receiver

    CompanyCreated:
      type: string
      format: xml
      description: |
        Verplicht: name, vatNumber (begint met landcode: BE, NL, ...)
        Optioneel: email, phone, address

    CompanyUpdated:
      type: string
      format: xml
      description: |
        Verplicht: vatNumber (sleutel, nooit zelf te wijzigen), updatedFields (min. 1 veld)
        vatNumber wordt gebruikt om Account in Salesforce op te zoeken

    CompanyDataRequest:
      type: string
      format: xml
      description: |
        Verplicht: requestId, vatNumber

    CompanyDataResponse:
      type: string
      format: xml
      description: |
        Verplicht: requestId
        Optioneel: name, vatNumber, email, address (leeg indien bedrijf niet gevonden)
        requestId correleert request en response

    MailRequest:
      type: string
      format: xml
      description: |
        Verplicht: header.source (="CRM"), header.timestamp (ISO 8601 UTC),
                   recipient.email, recipient.name,
                   dynamic_data.guest_name, dynamic_data.session_name, dynamic_data.session_time
        Optioneel: dynamic_data.session_location
        1 bericht per ontvanger — geen lijsten
        SendGrid Template ID: nog aan te maken door Mailing TL

    Heartbeat:
      type: string
      format: xml
      description: |
        Verplicht: serviceId (altijd "CRM"), timestamp (ISO 8601 UTC)
        Geen extra velden toegestaan (schema strict — Controlroom-schemas.md)
        Frequentie: elke 1 seconde

    StatusCheck:
      type: string
      format: xml
      description: |
        Verplicht: serviceId, timestamp, status, uptime, systemLoad.cpu, systemLoad.memory, systemLoad.disk
        status: healthy | degraded | unhealthy | unknown
        uptime: seconden (integer)
        cpu, memory, disk: decimaal 0.0–1.0
        Frequentie: nog te bepalen (voorstel: elke 30 seconden)

    Warning:
      type: string
      format: xml
      description: |
        Verplicht: serviceId, message, type
        type: heartbeat | statusCheck | user (DuplicateTypeEnum — Controlroom-schemas.md)
        CRM logt als error in applicatielog — geen crash

    PersonLookup:
      type: string
      format: xml
      description: |
        Verplicht: requestId, email (geldig formaat)

    PersonResponse:
      type: string
      format: xml
      description: |
        Verplicht: requestId, found (boolean), linkedToCompany (boolean)
        Optioneel: companyName (alleen als linkedToCompany = true)
        Als found = false: linkedToCompany altijd false

    SessionUpdate:
      type: string
      format: xml
      description: |
        Verplicht: sessionId, sessionName, newTime (ISO 8601 UTC), changeType
        Optioneel: newLocation
        changeType: rescheduled | cancelled | updated

    BadgeLink:
      type: string
      format: xml
      description: |
        Verplicht: badgeId (uniek), contactEmail (bestaand Contact in Salesforce), linkedAt (ISO 8601 UTC)
        Als contactEmail onbekend: fout loggen, geen crash

  securitySchemes:
    rabbitmq:
      type: userPassword
      description: RabbitMQ gebruikersnaam en wachtwoord — nooit in Git, via .env
