  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:
    RegistrationCreated:
      type: object
      required:
        - registrationId
        - firstName
        - lastName
        - email
        - sessionId
        - role
        - gdprConsent
      properties:
        registrationId:
          type: string
          description: >-
            Uniek ID per inschrijving — gegenereerd door Frontend. Gebruikt door
            CRM-receiver voor idempotentie en als externe sleutel voor de
            sessie-inschrijving in Salesforce.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          description: RFC 5322
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        sessionId:
          type: string
          description: >-
            Planning-sessie-id. CRM bewaart dit op de sessie-inschrijving, niet
            op het canonieke Contact.
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
          description: >-
            Verplicht — VISITOR voor privépersonen, COMPANY_CONTACT als company
            meegegeven wordt. CRM leidt de Salesforce-rol hieruit af.
        gdprConsent:
          type: boolean
          description: >-
            Verplicht — moet true zijn. CRM weigert aanmaak als false.
            Mailing gebruikt dit om te bepalen of mail verstuurd mag worden.
        company:
          type: string
          description: >-
            Optioneel — verplicht als role=COMPANY_CONTACT. Niet leeg indien
            aanwezig. CRM zoekt of maakt het bijhorende Account op basis van
            deze naam.

    RegistrationChanged:
      type: object
      required:
        - email
        - sessionId
        - changeType
      description: >
        Bij updated: Contact en bijhorende sessie-inschrijving bijwerken.
        Bij cancelled: eerst de sessie-inschrijving deactiveren; alleen als er
        geen actieve sessie-inschrijvingen meer overblijven voor dat Contact
        publiceert CRM crm.user.deactivated. Als een legacy Contact nog geen
        matchende sessie-inschrijving heeft, valt CRM alleen terug op
        Contactniveau wanneer er geen andere actieve sessie-inschrijvingen en
        geen native Planning/Mailing-identiteit meer zijn, zodat cancelled
        downstream nog steeds een veilige soft delete kan triggeren.
        US-46 (offline buffering R3): zelfde queue, lokale buffer in receiver.
        US-34/US-35 (R2): bij conflicterende data crm.user.conflict publiceren.
      properties:
        registrationId:
          type: string
          description: >-
            Optioneel — aanbevolen. Correleert met registrationId uit
            RegistrationCreated en identificeert de sessie-inschrijving
            eenduidig wanneer één Contact meerdere sessies heeft. Een replay van
            RegistrationCreated mag alleen als pure retry behandeld worden
            wanneer deze sessie-inschrijving nog actief is.
        email:
          type: string
          format: email
        sessionId:
          type: string
        changeType:
          type: string
          enum:
            - updated
            - cancelled
        updatedFields:
          type: object
          description: Optioneel — alleen bij changeType=updated.
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
              description: Optioneel — internationaal formaat (+32...)
            role:
              type: string
              enum:
                - VISITOR
                - COMPANY_CONTACT
            company:
              type: string

    FacturatieUserCreated:
      type: object
      required:
        - facturatieCustomerId
        - firstName
        - lastName
        - email
        - role
        - isActive
        - createdAt
      description: >-
        Facturatie meldt een handmatig aangemaakte klant zodat CRM een Contact
        kan aanmaken in Salesforce en een CRM UUID kan toekennen.
        Bij een uniek bestaand Contact hergebruikt CRM dat Contact en kent zo nodig
        eerst een CRM UUID toe. Deze flow publiceert geen crm.mail.requested.
      properties:
        facturatieCustomerId:
          type: string
          description: Interne klant-ID in FOSSBilling. Inbound-only voor CRM in v1.6.0.
        registrationId:
          type: string
          description: Optioneel — doorgegeven als er al een registratiereferentie bestaat.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Optioneel — UUID v4 van gekoppeld bedrijf indien al gekend in Facturatie.
        isActive:
          type: boolean
          description: Verplicht — Facturatie-side state. CRM mirrors dit naar de Contact active-flag in Salesforce.
        createdAt:
          type: string
          format: date-time

    FacturatieUserUpdated:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - updatedAt
      description: >-
        Facturatie stuurt een volledig update-object voor een user die al een
        CRM UUID heeft. Routing key en richting onderscheiden dit contract van
        het outbound CRM event met dezelfde XML-root.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        street:
          type: string
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    FacturatieUserDeactivated:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      description: >-
        Facturatie vraagt CRM om een bestaande CRM-linked user soft te
        deactiveren.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    MailingUserCreated:
      type: object
      required:
        - id
        - email
        - isActive
      description: >-
        Mailing synchroniseert een user uit de eigen datastore naar CRM. Deze
        payload volgt de producer-XSD en bevat bewust alleen de velden die
        Mailing persistent bewaart.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Optioneel — mag in de producer-XSD ook expliciet nil zijn.
        lastName:
          type: string
          description: Optioneel — mag in de producer-XSD ook expliciet nil zijn.
        isActive:
          type: boolean
          description: Verplicht — Mailing-side state. CRM mirrors dit naar de Contact active-flag in Salesforce.
        companyId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Optioneel — UUID v4 van gekoppeld bedrijf indien al gekend in Mailing.

    MailingUserUpdated:
      type: object
      required:
        - id
        - email
        - isActive
      description: >-
        Mailing stuurt steeds het volledige gekende user-object om partial
        merge-ambiguiteit bij CRM te vermijden.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: >-
            CRM master UUID (Option 2 UUID-strategie) die Mailing in
            `crm.user.confirmed` heeft ontvangen. CRM resolvet strict op
            `CRM_ID__c`; `Mailing_ID__c` blijft als provenance-veld bewaard
            maar wordt niet gebruikt voor lookup.
        email:
          type: string
          format: email
        firstName:
          type: string
          description: Optioneel — mag in de producer-XSD ook expliciet nil zijn.
        lastName:
          type: string
          description: Optioneel — mag in de producer-XSD ook expliciet nil zijn.
        isActive:
          type: boolean
          description: Wanneer false publiceert CRM crm.user.deactivated in plaats van crm.user.updated.
        companyId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Optioneel — UUID v4 van gekoppeld bedrijf indien al gekend in Mailing.

    MailingUserDeactivated:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      description: >-
        Mailing vraagt CRM om een bestaande user te deactiveren. CRM voert
        enkel soft delete uit en publiceert daarna crm.user.deactivated.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: >-
            CRM master UUID (Option 2 UUID-strategie) die Mailing in
            `crm.user.confirmed` heeft ontvangen. CRM resolvet strict op
            `CRM_ID__c`.
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    PlanningUserCreated:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - gdprConsent
      description: >-
        Planning synchroniseert een user uit de eigen datastore naar CRM.
        Lokale CRM-contractnummering gebruikt 30; Planning documenteert dit
        contract zelf als referentie 21.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - SPEAKER
            - VISITOR
        gdprConsent:
          type: boolean
          description: Verplicht — Planning levert enkel users met expliciete toestemming.
        phoneNumber:
          type: string
          description: Optioneel — Planning-specifieke telefoonveldnaam.
        company:
          type: string
          description: Optioneel — bedrijfsnaam uit Planning, geen CRM companyId.

    PlanningUserUpdated:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - gdprConsent
      description: >-
        Planning stuurt steeds het volledige gekende user-object voor updates.
        Lokale CRM-contractnummering gebruikt 31; Planning documenteert dit
        contract zelf als referentie 22.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - SPEAKER
            - VISITOR
        gdprConsent:
          type: boolean
        phoneNumber:
          type: string
          description: Optioneel — Planning-specifieke telefoonveldnaam.
        company:
          type: string
          description: Optioneel — bedrijfsnaam uit Planning, geen CRM companyId.

    PlanningUserDeactivated:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      description: >-
        Planning vraagt CRM om een bestaande user soft te deactiveren. Lokale
        CRM-contractnummering gebruikt 32; Planning documenteert dit contract
        zelf als referentie 23.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    CompanyCreated:
      type: object
      required:
        - name
        - vatNumber
      properties:
        name:
          type: string
        vatNumber:
          type: string
          description: Belgisch formaat BE + 10 cijfers
          pattern: "^BE[0-9]{10}$"
        email:
          type: string
          format: email
        phone:
          type: string
        street:
          type: string
        houseNumber:
          type: string
          description: Inclusief bus indien van toepassing
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2. Standaard BE.

    CompanyUpdatedBroadcast:
      type: object
      required:
        - id
        - vatNumber
        - name
        - isActive
        - updatedAt
      description: >-
        Volledig object — consumers vervangen lokale kopie volledig.
        Wordt gepubliceerd op crm.company.updated door CRM na update in Salesforce.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        street:
          type: string
        houseNumber:
          type: string
          description: Inclusief bus indien van toepassing
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    CompanyDataRequest:
      type: object
      required:
        - requestId
        - vatNumber
      properties:
        requestId:
          type: string
        vatNumber:
          type: string
          description: Belgisch formaat BE + 10 cijfers
          pattern: "^BE[0-9]{10}$"

    CompanyDataResponse:
      type: object
      required:
        - requestId
        - found
      properties:
        requestId:
          type: string
        found:
          type: boolean
        id:
          type: string
          format: uuid
          description: UUID v4 van Account in Salesforce — alleen aanwezig als found=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        name:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        vatNumber:
          type: string
          description: Optioneel — alleen aanwezig als found=true. Belgisch formaat BE + 10 cijfers.
          pattern: "^BE[0-9]{10}$"
        email:
          type: string
          format: email
          description: Optioneel — alleen aanwezig als found=true
        phone:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        street:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        houseNumber:
          type: string
          description: Optioneel — alleen aanwezig als found=true. Inclusief bus.
        postalCode:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        city:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: Optioneel — alleen aanwezig als found=true. ISO 3166-1 alpha-2.

    MailRequest:
      type: object
      required:
        - header
        - mailType
        - recipient
        - dynamic_data
      description: >
        1 bericht per ontvanger — geen lijsten.
        mailType bepaalt welk SendGrid-template Mailing selecteert.
        US-03/US-22/US-23 R1. US-24 (herinnering) R2 — mailType=session_reminder.
      properties:
        header:
          type: object
          required:
            - source
            - timestamp
          properties:
            source:
              type: string
              enum:
                - CRM
            timestamp:
              type: string
              format: date-time
        mailType:
          type: string
          enum:
            - registration_confirmation
            - session_change
            - session_reminder
            - bulk_event
        recipient:
          type: object
          required:
            - email
            - name
          properties:
            email:
              type: string
              format: email
            name:
              type: string
        dynamic_data:
          type: object
          required:
            - guest_name
          properties:
            guest_name:
              type: string
            session_name:
              type: string
              description: Verplicht voor alle mailTypes behalve bulk_event
            session_time:
              type: string
              format: date-time
              description: >-
                Aanwezig wanneer de flow een concreet tijdstip heeft.
                Geannuleerde session_change-mails mogen dit veld weglaten.
            session_location:
              type: string

    Heartbeat:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - timestamp
      description: Geen extra velden toegestaan. Frequentie elke 1 seconde.
      properties:
        serviceId:
          type: string
          enum:
            - CRM
        timestamp:
          type: string
          format: date-time

    StatusCheck:
      type: object
      required:
        - serviceId
        - timestamp
        - status
        - uptime
        - systemLoad
      description: Frequentie nog te bepalen (voorstel elke 30 seconden).
      properties:
        serviceId:
          type: string
          enum:
            - CRM
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
        uptime:
          type: integer
          description: Seconden
        systemLoad:
          type: object
          required:
            - cpu
            - memory
            - disk
          properties:
            cpu:
              type: number
              minimum: 0
              maximum: 1
            memory:
              type: number
              minimum: 0
              maximum: 1
            disk:
              type: number
              minimum: 0
              maximum: 1

    Warning:
      type: object
      required:
        - serviceId
        - message
        - type
      description: CRM logt als error in applicatielog — geen crash.
      properties:
        serviceId:
          type: string
          description: ID van het systeem waarover de warning gaat (niet beperkt tot CRM)
        message:
          type: string
        type:
          type: string
          enum:
            - heartbeat
            - statusCheck
            - user

    PersonLookup:
      type: object
      required:
        - requestId
        - email
      properties:
        requestId:
          type: string
        email:
          type: string
          format: email

    PersonResponse:
      type: object
      required:
        - requestId
        - found
        - linkedToCompany
      properties:
        requestId:
          type: string
        found:
          type: boolean
        linkedToCompany:
          type: boolean
          description: Altijd false als found=false
        id:
          type: string
          format: uuid
          description: UUID v4 van Contact in Salesforce — alleen aanwezig als found=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        companyName:
          type: string
          description: Optioneel — alleen aanwezig als linkedToCompany=true
        companyId:
          type: string
          format: uuid
          description: UUID v4 van Account — alleen aanwezig als linkedToCompany=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

    SessionUpdate:
      type: object
      required:
        - sessionId
        - sessionName
        - changeType
      properties:
        sessionId:
          type: string
        sessionName:
          type: string
        newTime:
          type: string
          format: date-time
          description: Verplicht bij rescheduled en updated
        changeType:
          type: string
          enum:
            - rescheduled
            - cancelled
            - updated
          description: CRM behandelt updated downstream als een generieke session_change-mail.
        newLocation:
          type: string
      if:
        properties:
          changeType:
            enum:
              - rescheduled
              - updated
      then:
        required:
          - newTime

    BadgeLink:
      type: object
      required:
        - badgeId
        - contactEmail
        - linkedAt
      description: Als contactEmail onbekend in Salesforce — fout loggen, geen crash.
      properties:
        badgeId:
          type: string
        contactEmail:
          type: string
          format: email
        linkedAt:
          type: string
          format: date-time

    UserConfirmed:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - confirmedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 — gegenereerd door CRM. Canonical identifier voor dit contact.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
          description: RFC 5322 — deduplicatiesleutel in Salesforce
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          description: Optioneel — alleen aanwezig als role=COMPANY_CONTACT
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        badgeCode:
          type: string
          description: >-
            Optioneel — null tot badge uitgereikt aan inkom. Nodig voor US-49
            (automatische factuur op basis van badge-data na event).
          maxLength: 32
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
          description: >-
            Verplicht — Mailing gebruikt dit om te bepalen of een mail verstuurd
            mag worden. Moet true zijn bij inschrijving.
        confirmedAt:
          type: string
          format: date-time

    CompanyConfirmed:
      type: object
      required:
        - id
        - vatNumber
        - name
        - email
        - isActive
        - confirmedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 — gegenereerd door CRM. Canonical identifier voor dit bedrijf.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        name:
          type: string
        email:
          type: string
          format: email
          description: >-
            Facturatie-e-mailadres. Nodig voor FOSSBilling bij aanmaak —
            voorkomt extra roundtrip via Contract 5.
        isActive:
          type: boolean
        confirmedAt:
          type: string
          format: date-time

    UserConflict:
      type: object
      required:
        - email
        - existingValue
        - incomingValue
        - detectedAt
      properties:
        email:
          type: string
          format: email
          description: E-mail die als deduplicatiesleutel gebruikt werd
        existingValue:
          type: object
          description: Huidige waarden in Salesforce
          required:
            - firstName
            - lastName
          properties:
            firstName:
              type: string
            lastName:
              type: string
            company:
              type: string
        incomingValue:
          type: object
          description: Binnenkomende waarden die afwijken
          required:
            - firstName
            - lastName
          properties:
            firstName:
              type: string
            lastName:
              type: string
            company:
              type: string
        detectedAt:
          type: string
          format: date-time

    PaymentConfirmed:
      type: object
      required:
        - email
        - amount
        - currency
        - paidAt
      properties:
        userId:
          type: string
          format: uuid
          description: Optioneel — UUID v4 als Kassa dit al heeft via crm.user.confirmed
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
          description: Fallback lookup als userId niet beschikbaar is
        registrationId:
          type: string
          description: >-
            Optioneel, aanbevolen — correleert met registrationId uit
            RegistrationCreated. Nodig als een persoon voor meerdere sessies
            is ingeschreven zodat CRM de juiste inschrijving kan markeren
            als betaald.
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          enum:
            - EUR
        paidAt:
          type: string
          format: date-time
          description: >-
            Betalingstijdstip voor de sessie-inschrijving. CRM houdt
            Contact.Paid_At__c alleen bij als monotone compatibiliteitswaarde:
            een ouder event mag die afgeleide niet terugzetten.

    UnpaidRequest:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string

    UnpaidResponse:
      type: object
      required:
        - requestId
        - persons
      properties:
        requestId:
          type: string
        persons:
          type: array
          items:
            type: object
            required:
              - id
              - firstName
              - lastName
              - email
              - linkedToCompany
            properties:
              id:
                type: string
                format: uuid
                pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
                format: email
              linkedToCompany:
                type: boolean
              companyName:
                type: string
                description: Optioneel — alleen aanwezig als linkedToCompany=true

    UserUpdated:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - updatedAt
      description: Volledig object — consumers vervangen lokale kopie volledig.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          description: Optioneel — alleen aanwezig als role=COMPANY_CONTACT
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        badgeCode:
          type: string
          description: >-
            Optioneel — null tot badge uitgereikt aan inkom. Nodig voor US-49
            (automatische factuur op basis van badge-data na event).
          maxLength: 32
        street:
          type: string
          description: Optioneel — ingevuld bij factuurverzoek privépersoon
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
          description: Mailing gebruikt dit om te bepalen of een mail verstuurd mag worden.
        updatedAt:
          type: string
          format: date-time

    BounceReported:
      type: object
      required:
        - email
        - bounceType
        - bouncedAt
      properties:
        email:
          type: string
          format: email
        bounceType:
          type: string
          enum:
            - hard
            - soft
          description: hard = permanent onbereikbaar, soft = tijdelijk
        reason:
          type: string
          description: Optioneel — foutbericht van SendGrid
        bouncedAt:
          type: string
          format: date-time

    InvoiceRequested:
      type: object
      required:
        - userId
        - email
        - firstName
        - lastName
        - street
        - houseNumber
        - postalCode
        - city
        - country
        - requestedAt
      properties:
        userId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        requestedAt:
          type: string
          format: date-time

    UserDeactivated:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    CompanyDeactivated:
      type: object
      required:
        - id
        - vatNumber
        - deactivatedAt
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        deactivatedAt:
          type: string
          format: date-time

  securitySchemes:
    rabbitmq:
      type: userPassword
      description: RabbitMQ gebruikersnaam en wachtwoord — nooit in Git, via .env
