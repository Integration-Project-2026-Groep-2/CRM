            </invoice_requested>

    UserDeactivated:
      name: UserDeactivated
      title: Contact gedeactiveerd (GDPR)
      summary: >-
        CRM meldt dat een Contact gedeactiveerd is. isActive=false — nooit
        fysiek verwijderen (GDPR audit trail). Consumers stoppen met verwerking
        voor deze persoon.
      contentType: application/xml
      tags:
        - name: US-55
      payload:
        $ref: "#/components/schemas/UserDeactivated"
      examples:
        - name: deactivatie
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <user_deactivated>
              <id>a1b2c3d4-e5f6-4789-ab01-cd2345ef6789</id>
              <email>jan.janssen@example.com</email>
              <deactivatedAt>2026-04-15T16:00:00Z</deactivatedAt>
            </user_deactivated>

    CompanyDeactivated:
      name: CompanyDeactivated
      title: Account gedeactiveerd
      summary: >-
        CRM meldt dat een Account gedeactiveerd is. isActive=false. Consumers
        stoppen met verwerking voor dit bedrijf.
      contentType: application/xml
      tags:
        - name: US-54
      payload:
        $ref: "#/components/schemas/CompanyDeactivated"
      examples:
        - name: deactivatie
          payload: |
            <?xml version="1.0" encoding="UTF-8"?>
            <company_deactivated>
              <id>c3d4e5f6-a7b8-4901-8d23-ef4567ab8901</id>
              <vatNumber>BE0123456789</vatNumber>
              <deactivatedAt>2026-04-15T16:00:00Z</deactivatedAt>
            </company_deactivated>

  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:
    RegistrationCreated:
      type: object
      required:
        - registrationId
        - firstName
        - lastName
        - email
        - sessionId
        - role
        - gdprConsent
      properties:
        registrationId:
          type: string
          description: >-
            Uniek ID per inschrijving — gegenereerd door Frontend. Gebruikt door
            CRM-receiver voor idempotentie (duplicaat op queue = negeren).
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          description: RFC 5322
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        sessionId:
          type: string
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
          description: >-
            Verplicht — VISITOR voor privépersonen, COMPANY_CONTACT als company
            meegegeven wordt. CRM leidt de Salesforce-rol hieruit af.
        gdprConsent:
          type: boolean
          description: >-
            Verplicht — moet true zijn. CRM weigert aanmaak als false.
            Mailing gebruikt dit om te bepalen of mail verstuurd mag worden.
        company:
          type: string
          description: >-
            Optioneel — verplicht als role=COMPANY_CONTACT. Niet leeg indien
            aanwezig. CRM zoekt of maakt het bijhorende Account op basis van
            deze naam.

    RegistrationChanged:
      type: object
      required:
        - email
        - sessionId
        - changeType
      description: >
        Bij cancelled: Contact deactiveren — geen verwijdering (US-55 GDPR R3).
        Na verwerking publiceert CRM crm.user.updated of crm.user.deactivated.
        US-46 (offline buffering R3): zelfde queue, lokale buffer in receiver.
        US-34/US-35 (R2): bij conflicterende data crm.user.conflict publiceren.
      properties:
        registrationId:
          type: string
          description: >-
            Optioneel — aanbevolen. Correleert met registrationId uit
            RegistrationCreated.
        email:
          type: string
          format: email
        sessionId:
          type: string
        changeType:
          type: string
          enum:
            - updated
            - cancelled
        updatedFields:
          type: object
          description: Optioneel — alleen bij changeType=updated.
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
              description: Optioneel — internationaal formaat (+32...)
            role:
              type: string
              enum:
                - VISITOR
                - COMPANY_CONTACT
            company:
              type: string

    CompanyCreated:
      type: object
      required:
        - name
        - vatNumber
      properties:
        name:
          type: string
        vatNumber:
          type: string
          description: Belgisch formaat BE + 10 cijfers
          pattern: "^BE[0-9]{10}$"
        email:
          type: string
          format: email
        phone:
          type: string
        street:
          type: string
        houseNumber:
          type: string
          description: Inclusief bus indien van toepassing
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2. Standaard BE.

    CompanyUpdatedBroadcast:
      type: object
      required:
        - id
        - vatNumber
        - name
        - isActive
        - updatedAt
      description: >-
        Volledig object — consumers vervangen lokale kopie volledig.
        Wordt gepubliceerd op crm.company.updated door CRM na update in Salesforce.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        street:
          type: string
        houseNumber:
          type: string
          description: Inclusief bus indien van toepassing
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2
        isActive:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    CompanyDataRequest:
      type: object
      required:
        - requestId
        - vatNumber
      properties:
        requestId:
          type: string
        vatNumber:
          type: string
          description: Belgisch formaat BE + 10 cijfers
          pattern: "^BE[0-9]{10}$"

    CompanyDataResponse:
      type: object
      required:
        - requestId
        - found
      properties:
        requestId:
          type: string
        found:
          type: boolean
        id:
          type: string
          format: uuid
          description: UUID v4 van Account in Salesforce — alleen aanwezig als found=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        name:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        vatNumber:
          type: string
          description: Optioneel — alleen aanwezig als found=true. Belgisch formaat BE + 10 cijfers.
          pattern: "^BE[0-9]{10}$"
        email:
          type: string
          format: email
          description: Optioneel — alleen aanwezig als found=true
        phone:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        street:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        houseNumber:
          type: string
          description: Optioneel — alleen aanwezig als found=true. Inclusief bus.
        postalCode:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        city:
          type: string
          description: Optioneel — alleen aanwezig als found=true
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: Optioneel — alleen aanwezig als found=true. ISO 3166-1 alpha-2.

    MailRequest:
      type: object
      required:
        - header
        - mailType
        - recipient
        - dynamic_data
      description: >
        1 bericht per ontvanger — geen lijsten.
        mailType bepaalt welk SendGrid-template Mailing selecteert.
        US-03/US-22/US-23 R1. US-24 (herinnering) R2 — mailType=session_reminder.
      properties:
        header:
          type: object
          required:
            - source
            - timestamp
          properties:
            source:
              type: string
              enum:
                - CRM
            timestamp:
              type: string
              format: date-time
        mailType:
          type: string
          enum:
            - registration_confirmation
            - session_change
            - session_reminder
            - bulk_event
        recipient:
          type: object
          required:
            - email
            - name
          properties:
            email:
              type: string
              format: email
            name:
              type: string
        dynamic_data:
          type: object
          required:
            - guest_name
          properties:
            guest_name:
              type: string
            session_name:
              type: string
              description: Verplicht voor alle mailTypes behalve bulk_event
            session_time:
              type: string
              format: date-time
              description: Verplicht voor alle mailTypes behalve bulk_event
            session_location:
              type: string

    Heartbeat:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - timestamp
      description: Geen extra velden toegestaan. Frequentie elke 1 seconde.
      properties:
        serviceId:
          type: string
          enum:
            - CRM
        timestamp:
          type: string
          format: date-time

    StatusCheck:
      type: object
      required:
        - serviceId
        - timestamp
        - status
        - uptime
        - systemLoad
      description: Frequentie nog te bepalen (voorstel elke 30 seconden).
      properties:
        serviceId:
          type: string
          enum:
            - CRM
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
        uptime:
          type: integer
          description: Seconden
        systemLoad:
          type: object
          required:
            - cpu
            - memory
            - disk
          properties:
            cpu:
              type: number
              minimum: 0
              maximum: 1
            memory:
              type: number
              minimum: 0
              maximum: 1
            disk:
              type: number
              minimum: 0
              maximum: 1

    Warning:
      type: object
      required:
        - serviceId
        - message
        - Type
      description: CRM logt als error in applicatielog — geen crash.
      properties:
        serviceId:
          type: string
          enum:
            - CRM
        message:
          type: string
        Type:
          type: string
          enum:
            - heartbeat
            - statusCheck
            - user

    PersonLookup:
      type: object
      required:
        - requestId
        - email
      properties:
        requestId:
          type: string
        email:
          type: string
          format: email

    PersonResponse:
      type: object
      required:
        - requestId
        - found
        - linkedToCompany
      properties:
        requestId:
          type: string
        found:
          type: boolean
        linkedToCompany:
          type: boolean
          description: Altijd false als found=false
        id:
          type: string
          format: uuid
          description: UUID v4 van Contact in Salesforce — alleen aanwezig als found=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        companyName:
          type: string
          description: Optioneel — alleen aanwezig als linkedToCompany=true
        companyId:
          type: string
          format: uuid
          description: UUID v4 van Account — alleen aanwezig als linkedToCompany=true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

    SessionUpdate:
      type: object
      required:
        - sessionId
        - sessionName
        - changeType
      properties:
        sessionId:
          type: string
        sessionName:
          type: string
        newTime:
          type: string
          format: date-time
          description: Verplicht bij rescheduled en updated
        changeType:
          type: string
          enum:
            - rescheduled
            - cancelled
            - updated
        newLocation:
          type: string
      if:
        properties:
          changeType:
            enum:
              - rescheduled
              - updated
      then:
        required:
          - newTime

    BadgeLink:
      type: object
      required:
        - badgeId
        - contactEmail
        - linkedAt
      description: Als contactEmail onbekend in Salesforce — fout loggen, geen crash.
      properties:
        badgeId:
          type: string
        contactEmail:
          type: string
          format: email
        linkedAt:
          type: string
          format: date-time

    UserConfirmed:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - confirmedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 — gegenereerd door CRM. Canonical identifier voor dit contact.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
          description: RFC 5322 — deduplicatiesleutel in Salesforce
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          description: Optioneel — alleen aanwezig als role=COMPANY_CONTACT
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        badgeCode:
          type: string
          description: >-
            Optioneel — null tot badge uitgereikt aan inkom. Nodig voor US-49
            (automatische factuur op basis van badge-data na event).
          maxLength: 32
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
          description: >-
            Verplicht — Mailing gebruikt dit om te bepalen of een mail verstuurd
            mag worden. Moet true zijn bij inschrijving.
        confirmedAt:
          type: string
          format: date-time

    CompanyConfirmed:
      type: object
      required:
        - id
        - vatNumber
        - name
        - email
        - isActive
        - confirmedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 — gegenereerd door CRM. Canonical identifier voor dit bedrijf.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        name:
          type: string
        email:
          type: string
          format: email
          description: >-
            Facturatie-e-mailadres. Nodig voor FOSSBilling bij aanmaak —
            voorkomt extra roundtrip via Contract 5.
        isActive:
          type: boolean
        confirmedAt:
          type: string
          format: date-time

    UserConflict:
      type: object
      required:
        - email
        - existingValue
        - incomingValue
        - detectedAt
      properties:
        email:
          type: string
          format: email
          description: E-mail die als deduplicatiesleutel gebruikt werd
        existingValue:
          type: object
          description: Huidige waarden in Salesforce
          properties:
            firstName:
              type: string
            lastName:
              type: string
            company:
              type: string
        incomingValue:
          type: object
          description: Binnenkomende waarden die afwijken
          properties:
            firstName:
              type: string
            lastName:
              type: string
            company:
              type: string
        detectedAt:
          type: string
          format: date-time

    PaymentConfirmed:
      type: object
      required:
        - email
        - amount
        - currency
        - paidAt
      properties:
        userId:
          type: string
          format: uuid
          description: Optioneel — UUID v4 als Kassa dit al heeft via crm.user.confirmed
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
          description: Fallback lookup als userId niet beschikbaar is
        registrationId:
          type: string
          description: >-
            Optioneel, aanbevolen — correleert met registrationId uit
            RegistrationCreated. Nodig als een persoon voor meerdere sessies
            is ingeschreven zodat CRM de juiste inschrijving kan markeren
            als betaald.
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          enum:
            - EUR
        paidAt:
          type: string
          format: date-time

    UnpaidRequest:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string

    UnpaidResponse:
      type: object
      required:
        - requestId
        - persons
      properties:
        requestId:
          type: string
        persons:
          type: array
          items:
            type: object
            required:
              - id
              - firstName
              - lastName
              - email
              - linkedToCompany
            properties:
              id:
                type: string
                format: uuid
                pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
                format: email
              linkedToCompany:
                type: boolean
              companyName:
                type: string
                description: Optioneel — alleen aanwezig als linkedToCompany=true

    UserUpdated:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - isActive
        - gdprConsent
        - updatedAt
      description: Volledig object — consumers vervangen lokale kopie volledig.
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: Optioneel — internationaal formaat (+32...)
        role:
          type: string
          enum:
            - VISITOR
            - COMPANY_CONTACT
            - SPEAKER
            - EVENT_MANAGER
            - CASHIER
            - BAR_STAFF
            - ADMIN
        companyId:
          type: string
          format: uuid
          description: Optioneel — alleen aanwezig als role=COMPANY_CONTACT
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        badgeCode:
          type: string
          description: >-
            Optioneel — null tot badge uitgereikt aan inkom. Nodig voor US-49
            (automatische factuur op basis van badge-data na event).
          maxLength: 32
        street:
          type: string
          description: Optioneel — ingevuld bij factuurverzoek privépersoon
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        isActive:
          type: boolean
        gdprConsent:
          type: boolean
          description: Mailing gebruikt dit om te bepalen of een mail verstuurd mag worden.
        updatedAt:
          type: string
          format: date-time

    BounceReported:
      type: object
      required:
        - email
        - bounceType
        - bouncedAt
      properties:
        email:
          type: string
          format: email
        bounceType:
          type: string
          enum:
            - hard
            - soft
          description: hard = permanent onbereikbaar, soft = tijdelijk
        reason:
          type: string
          description: Optioneel — foutbericht van SendGrid
        bouncedAt:
          type: string
          format: date-time

    InvoiceRequested:
      type: object
      required:
        - userId
        - email
        - firstName
        - lastName
        - street
        - houseNumber
        - postalCode
        - city
        - country
        - requestedAt
      properties:
        userId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        houseNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        requestedAt:
          type: string
          format: date-time

    UserDeactivated:
      type: object
      required:
        - id
        - email
        - deactivatedAt
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        email:
          type: string
          format: email
        deactivatedAt:
          type: string
          format: date-time

    CompanyDeactivated:
      type: object
      required:
        - id
        - vatNumber
        - deactivatedAt
      properties:
        id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        vatNumber:
          type: string
          pattern: "^BE[0-9]{10}$"
        deactivatedAt:
          type: string
          format: date-time

  securitySchemes:
    rabbitmq:
      type: userPassword
      description: RabbitMQ gebruikersnaam en wachtwoord — nooit in Git, via .env
