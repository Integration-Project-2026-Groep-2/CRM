asyncapi: 3.1.0
info:
  title: Integratieproject 2026 — CRM (Salesforce) RabbitMQ Contracts
  version: 1.5.0
  description: >
    XML-contracten voor alle integraties waarbij het CRM-team (Salesforce)
    betrokken is.

    Elk contract legt vast wie naar wie stuurt, via welke queue en in welk
    XML-formaat.

    Queue-namen zijn voorstellen — nog te bevestigen met de betrokken teams,
    tenzij anders vermeld.

    Alle berichten zijn XML-formaat (projectbrede afspraak, bevestigd door PMs).
  contact:
    name: Lars Cowé — CRM Team Lead
    email: lars.cowe@student.ehb.be
servers:
  production:
    host: integrationproject-2526s2-dag02.westeurope.cloudapp.azure.com:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: >-
      Azure VM — RabbitMQ broker (Infra team). Poort 5672 nog niet bevestigd
      open (zie infra-vm.md). RabbitMQ credentials pending bij Infra.
    security:
      - $ref: "#/components/securitySchemes/rabbitmq"
defaultContentType: application/xml

channels:
  # ============================================================
  # FRONTEND → CRM
  # ============================================================

  frontendRegistrationCreated:
    address: frontend.registration.created
    description: >-
      Contract 1 — Frontend → CRM: nieuwe inschrijving aanmaken (US-02, US-03,
      US-04, US-05, US-19 | R1)
    messages:
      registrationCreated:
        $ref: "#/components/messages/RegistrationCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  frontendRegistrationUpdated:
    address: frontend.registration.updated
    description: >-
      Contract 2 — Frontend → CRM: inschrijving wijzigen of annuleren (US-21 R1,
      US-33 R2)
    messages:
      registrationChanged:
        $ref: "#/components/messages/RegistrationChanged"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  frontendCompanyCreated:
    address: frontend.company.created
    description: >-
      Contract 3 (gecorrigeerd v1.3.0) — Frontend → CRM: nieuw bedrijf aanmaken
      als Account in Salesforce (US-40, US-20 | R1).

      ARCHITECTURELE CORRECTIE: in v1.2.0 was dit facturatie.company.created
      (Facturatie → CRM). Dat was verkeerd — CRM is master data owner.
      Facturatie is consumer van bedrijfsdata, geen producent. De eventbeheerder
      maakt bedrijven aan via de Frontend; CRM verwerkt en broadcast vervolgens
      crm.company.confirmed zodat Facturatie dat opslaat in FOSSBilling.

      PM-BESLISSING VEREIST: als bedrijven rechtstreeks in Salesforce aangemaakt
      worden (buiten Frontend om), vervalt dit inbound contract en is alleen
      crm.company.confirmed nodig.
    messages:
      companyCreated:
        $ref: "#/components/messages/CompanyCreated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # FACTURATIE → CRM (request/response)
  # ============================================================

  facturatieCompanyRequested:
    address: facturatie.company.requested
    description: >-
      Contract 5 (request) — Facturatie → CRM: bedrijfsdata opvragen via
      vatNumber (US-40, US-20 | R1)
    messages:
      companyDataRequest:
        $ref: "#/components/messages/CompanyDataRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyResponded:
    address: crm.company.responded
    description: >-
      Contract 5 (response) — CRM → Facturatie: bedrijfsdata terugsturen inclusief
      UUID (US-40, US-20 | R1). UUID toegevoegd v1.3.0.
    messages:
      companyDataResponse:
        $ref: "#/components/messages/CompanyDataResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CRM → MAILING
  # ============================================================

  crmMailRequested:
    address: crm.mail.requested
    description: >-
      Contract 6 — CRM → Mailing: deelnemersnotificatie via SendGrid (US-22,
      US-23 | R1). US-24 session_reminder is R2.
    messages:
      mailRequest:
        $ref: "#/components/messages/MailRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → CONTROLROOM
  # ============================================================

  crmHeartbeat:
    address: crm.heartbeat
    description: >-
      Contract 7 — CRM → Controlroom: heartbeat elke 1 seconde (US-25, US-26 |
      R1)
    messages:
      heartbeat:
        $ref: "#/components/messages/Heartbeat"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  crmStatusChecked:
    address: crm.status.checked
    description: >-
      Contract 8 — CRM → Controlroom: periodieke statuscheck met
      systeemmetrieken (US-25 | R1)
    messages:
      statusCheck:
        $ref: "#/components/messages/StatusCheck"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CONTROLROOM → CRM
  # ============================================================

  controlroomWarningIssued:
    address: controlroom.warning.issued
    description: >-
      Contract 9 — Controlroom → CRM: systeemwaarschuwing bij anomalie (US-26 |
      R1)
    messages:
      warning:
        $ref: "#/components/messages/Warning"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # KASSA → CRM (request/response)
  # ============================================================

  kassaPersonLookupRequested:
    address: kassa.person.lookup.requested
    description: >-
      Contract 10 (request) — Kassa → CRM: persoonscheck op basis van e-mail
      (US-47 | R1)
    messages:
      personLookup:
        $ref: "#/components/messages/PersonLookup"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmPersonLookupResponded:
    address: crm.person.lookup.responded
    description: >-
      Contract 10 (response) — CRM → Kassa: resultaat persoonscheck inclusief
      UUID (US-47 | R1). UUID + companyId toegevoegd v1.3.0.
    messages:
      personResponse:
        $ref: "#/components/messages/PersonResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # PLANNING → CRM
  # ============================================================

  planningSessionUpdated:
    address: planning.session.updated
    description: >-
      Contract 11 — Planning → CRM: sessiewijziging (US-23 R1, US-16 R2,
      US-53 R2). changeType=rescheduled dekt US-16 (sessie verzetten),
      changeType=cancelled dekt US-53 (sessie verwijderen). US-38
      (sprekernotificatie R3) is verantwoordelijkheid van Planning/Mailing — CRM
      beheert geen sprekerdata.
    messages:
      sessionUpdate:
        $ref: "#/components/messages/SessionUpdate"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # IOT → CRM
  # ============================================================

  iotBadgeLinked:
    address: iot.badge.linked
    description: >-
      Contract 12 — IoT → CRM: badge koppelen aan bezoeker via Raspberry Pi
      (US-28, US-29 | R2)
    messages:
      badgeLink:
        $ref: "#/components/messages/BadgeLink"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → ALLE CONSUMERS (UUID broadcasts — toegevoegd v1.3.0)
  # ============================================================

  crmUserConfirmed:
    address: crm.user.confirmed
    description: >-
      Contract 13 — CRM → alle consumers: Contact aangemaakt of bevestigd in
      Salesforce (US-02, US-19 | R1). Bevat het door CRM gegenereerde UUID v4.
      Consumers slaan dit op naast hun eigen native ID (Option 2 UUID-strategie).
      E-mail is de deduplicatiesleutel — dubbele inschrijving leidt tot
      crm.user.conflict (Contract 16).
    messages:
      userConfirmed:
        $ref: "#/components/messages/UserConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyConfirmed:
    address: crm.company.confirmed
    description: >-
      Contract 14 — CRM → alle consumers: Account aangemaakt of bevestigd in
      Salesforce (US-40, US-20 | R1). Bevat het door CRM gegenereerde UUID v4.
      Facturatie slaat dit op naast FOSSBilling-ID. Kassa slaat dit op naast
      Odoo-ID.
    messages:
      companyConfirmed:
        $ref: "#/components/messages/CompanyConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → CONTROLROOM/FRONTEND (conflict — toegevoegd v1.3.0)
  # ============================================================

  crmUserConflict:
    address: crm.user.conflict
    description: >-
      Contract 15 — CRM → Controlroom + Frontend: dubbele inschrijving
      gedetecteerd op basis van e-mail (US-34, US-35 | R2). CRM logt beide
      waarden en publiceert dit event zodat de eventbeheerder manueel kan
      beslissen welke correct is. Geen crash — bestaand Contact blijft actief.

      BINDING: dit channel gebruikt een fanout exchange (geen named queue).
      Controlroom en Frontend moeten elk een eigen queue aanmaken en die binden
      aan de exchange 'crm.user.conflict'. Voorbeeld (RabbitMQ Management UI of
      code): channel.queue_declare(queue='controlroom.user.conflict'),
      channel.queue_bind(exchange='crm.user.conflict',
      queue='controlroom.user.conflict'). Zonder binding ontvangen consumers
      geen berichten.
    messages:
      userConflict:
        $ref: "#/components/messages/UserConflict"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: crm.user.conflict
          type: fanout
          durable: true

  # ============================================================
  # KASSA → CRM (betaling — toegevoegd v1.3.0)
  # ============================================================

  kassaPaymentConfirmed:
    address: kassa.payment.confirmed
    description: >-
      Contract 16 — Kassa → CRM: betaling bevestigd aan de inkom (US-08, US-21 |
      R1). CRM werkt betalingsstatus bij op Contact in Salesforce. Zonder dit
      contract weet CRM nooit dat een deelnemer betaald heeft.
    messages:
      paymentConfirmed:
        $ref: "#/components/messages/PaymentConfirmed"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # KASSA → CRM (lijst niet-betaalden — toegevoegd v1.3.0)
  # ============================================================

  kassaUnpaidRequested:
    address: kassa.unpaid.requested
    description: >-
      Contract 17 (request) — Kassa → CRM: lijst van niet-betaalde deelnemers
      opvragen (US-07 | R1). PersonLookup (Contract 10) werkt per persoon —
      voor een overzichtslijst is dit apart contract nodig.
    messages:
      unpaidRequest:
        $ref: "#/components/messages/UnpaidRequest"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmUnpaidResponded:
    address: crm.unpaid.responded
    description: >-
      Contract 17 (response) — CRM → Kassa: lijst van niet-betaalde deelnemers
      (US-07 | R1).
    messages:
      unpaidResponse:
        $ref: "#/components/messages/UnpaidResponse"
    bindings:
      amqp:
        is: queue
        queue:
          durable: false

  # ============================================================
  # CRM → ALLE CONSUMERS (updates — toegevoegd v1.3.0)
  # ============================================================

  crmUserUpdated:
    address: crm.user.updated
    description: >-
      Contract 18 — CRM → alle consumers: Contact gewijzigd in Salesforce
      (US-21, US-41 | R2). Getriggerd bij elke update van een Contact: naam,
      adres, bedrijfskoppeling, rol. Consumers updaten hun lokale kopie.
      Bevat altijd het volledige object — geen partial updates.
    messages:
      userUpdated:
        $ref: "#/components/messages/UserUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyUpdated:
    address: crm.company.updated
    description: >-
      Contract 19 — CRM → alle consumers: Account gewijzigd in Salesforce
      (US-41 | R2). Facturatie heeft het bijgewerkte adres nodig voor correcte
      facturen. Bevat altijd het volledige object — geen partial updates.
    messages:
      companyUpdated:
        $ref: "#/components/messages/CompanyUpdated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # MAILING → CRM (bounce — toegevoegd v1.3.0)
  # ============================================================

  mailingBounceReported:
    address: mailing.bounce.reported
    description: >-
      Contract 20 — Mailing → CRM: e-mailbounce gerapporteerd door SendGrid
      (US-39 | R2). CRM markeert het e-mailadres als onbereikbaar op het
      Contact in Salesforce. Zonder dit contract mist US-39 de databron om
      te bepalen wie de mail niet ontvangen heeft.
    messages:
      bounceReported:
        $ref: "#/components/messages/BounceReported"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → FACTURATIE (factuurverzoek privépersoon — toegevoegd v1.3.0)
  # ============================================================

  crmInvoiceRequested:
    address: crm.invoice.requested
    description: >-
      Contract 21 — CRM → Facturatie: factuurverzoek voor privépersoon (US-11 |
      R3). Getriggerd nadat een privépersoon adresgegevens heeft ingevuld en
      een factuur aanvraagt.

      PM-BESLISSING VEREIST: crm.user.updated alleen is niet voldoende want
      Facturatie moet het onderscheid kennen tussen een gewone adresupdate en
      een expliciete factuurverzoek. Dit event maakt dat onderscheid expliciet.

      Sad path: als Facturatie offline is, buffert CRM dit verzoek lokaal en
      herzendt zodra Facturatie terug online is.
    messages:
      invoiceRequested:
        $ref: "#/components/messages/InvoiceRequested"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  # ============================================================
  # CRM → ALLE CONSUMERS (GDPR soft delete — toegevoegd v1.3.0)
  # ============================================================

  crmUserDeactivated:
    address: crm.user.deactivated
    description: >-
      Contract 22 — CRM → alle consumers: Contact gedeactiveerd in Salesforce
      (US-55 | R3). isActive=false — nooit fysiek verwijderen (GDPR audit trail).
      Kassa verwijdert de persoon uit de niet-betaalden lijst. Mailing verwijdert
      het adres uit mailinglijsten. Facturatie stopt met nieuwe posten voor
      deze persoon.
    messages:
      userDeactivated:
        $ref: "#/components/messages/UserDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

  crmCompanyDeactivated:
    address: crm.company.deactivated
    description: >-
      Contract 23 — CRM → alle consumers: Account gedeactiveerd in Salesforce
      (US-54 | R3). isActive=false. Facturatie stopt met factureren voor dit
      bedrijf. Kassa koppelt geen nieuwe betalingen meer aan dit bedrijf.
    messages:
      companyDeactivated:
        $ref: "#/components/messages/CompanyDeactivated"
    bindings:
      amqp:
        is: queue
        queue:
          durable: true

# ============================================================
# OPERATIONS
# ============================================================

operations:
  receiveRegistrationCreated:
    action: receive
    channel:
      $ref: "#/channels/frontendRegistrationCreated"
    messages:
      - $ref: "#/channels/frontendRegistrationCreated/messages/registrationCreated"
    summary: >-
      Ontvang nieuwe inschrijving van Frontend en sla op als Contact in
      Salesforce. Na bevestiging: publiceer crm.user.confirmed.
    tags:
      - name: frontend
      - name: release-1

  receiveRegistrationChanged:
    action: receive
    channel:
      $ref: "#/channels/frontendRegistrationUpdated"
    messages:
      - $ref: "#/channels/frontendRegistrationUpdated/messages/registrationChanged"
    summary: >-
      Ontvang inschrijvingswijziging of annulering van Frontend. Na verwerking:
      publiceer crm.user.updated of crm.user.deactivated (bij cancelled).
    tags:
      - name: frontend
      - name: release-1
      - name: US-33
      - name: release-2-partial

  receiveCompanyCreated:
    action: receive
    channel:
      $ref: "#/channels/frontendCompanyCreated"
    messages:
      - $ref: "#/channels/frontendCompanyCreated/messages/companyCreated"
    summary: >-
      Ontvang nieuw bedrijf van Frontend en maak Account aan in Salesforce.
      Na bevestiging: publiceer crm.company.confirmed.
    tags:
      - name: frontend
      - name: release-1

  receiveCompanyDataRequest:
    action: receive
    channel:
      $ref: "#/channels/facturatieCompanyRequested"
    messages:
      - $ref: "#/channels/facturatieCompanyRequested/messages/companyDataRequest"
    summary: Ontvang bedrijfsdataverzoek van Facturatie en stuur response terug
    reply:
      channel:
        $ref: "#/channels/crmCompanyResponded"
      messages:
        - $ref: "#/components/messages/CompanyDataResponse"
    tags:
      - name: facturatie
      - name: release-1

  sendMailRequest:
    action: send
    channel:
      $ref: "#/channels/crmMailRequested"
    messages:
      - $ref: "#/channels/crmMailRequested/messages/mailRequest"
    summary: >-
      Stuur mailverzoek naar Mailing. R1: registration_confirmation (US-03),
      bulk_event (US-22), session_change (US-23). R2: session_reminder (US-24).
    tags:
      - name: mailing
      - name: release-1

  sendHeartbeat:
    action: send
    channel:
      $ref: "#/channels/crmHeartbeat"
    messages:
      - $ref: "#/channels/crmHeartbeat/messages/heartbeat"
    summary: Publiceer heartbeat elke 1 seconde als bewijs dat CRM actief is
    tags:
      - name: controlroom
      - name: release-1

  sendStatusCheck:
    action: send
    channel:
      $ref: "#/channels/crmStatusChecked"
    messages:
      - $ref: "#/channels/crmStatusChecked/messages/statusCheck"
    summary: Stuur periodieke statuscheck met CPU-, geheugen- en schijfbelasting
    tags:
      - name: controlroom
      - name: release-1

  receiveWarning:
    action: receive
    channel:
      $ref: "#/channels/controlroomWarningIssued"
    messages:
      - $ref: "#/channels/controlroomWarningIssued/messages/warning"
    summary: Ontvang systeemwaarschuwing van Controlroom en log als error
    tags:
      - name: controlroom
      - name: release-1

  receivePersonLookup:
    action: receive
    channel:
      $ref: "#/channels/kassaPersonLookupRequested"
    messages:
      - $ref: "#/channels/kassaPersonLookupRequested/messages/personLookup"
    summary: Ontvang persoonscheck-verzoek van Kassa en stuur response terug inclusief UUID
    reply:
      channel:
        $ref: "#/channels/crmPersonLookupResponded"
      messages:
        - $ref: "#/components/messages/PersonResponse"
    tags:
      - name: kassa
      - name: release-1

  receiveSessionUpdate:
    action: receive
    channel:
      $ref: "#/channels/planningSessionUpdated"
    messages:
      - $ref: "#/channels/planningSessionUpdated/messages/sessionUpdate"
    summary: >-
      Ontvang sessiewijziging van Planning en notificeer betrokken deelnemers
      via Mailing (US-23). Sprekernotificaties (US-38) zijn buiten scope voor CRM.
    tags:
      - name: planning
      - name: release-1

  receiveBadgeLink:
    action: receive
    channel:
      $ref: "#/channels/iotBadgeLinked"
    messages:
      - $ref: "#/channels/iotBadgeLinked/messages/badgeLink"
    summary: >-
      Ontvang badge-koppeling van IoT en sla badgeId op bij Contact in Salesforce
    tags:
      - name: iot
      - name: release-2

  sendUserConfirmed:
    action: send
    channel:
      $ref: "#/channels/crmUserConfirmed"
    messages:
      - $ref: "#/channels/crmUserConfirmed/messages/userConfirmed"
    summary: >-
      Publiceer bevestigd Contact met UUID na Salesforce-validatie. Getriggerd
      door receiveRegistrationCreated. E-mail is deduplicatiesleutel — dubbele
      e-mail leidt tot sendUserConflict in plaats van dit event.
    tags:
      - name: frontend
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-1

  sendCompanyConfirmed:
    action: send
    channel:
      $ref: "#/channels/crmCompanyConfirmed"
    messages:
      - $ref: "#/channels/crmCompanyConfirmed/messages/companyConfirmed"
    summary: >-
      Publiceer bevestigd Account met UUID na Salesforce-verwerking. Getriggerd
      door receiveCompanyCreated. vatNumber is deduplicatiesleutel.
    tags:
      - name: facturatie
      - name: kassa
      - name: release-1

  sendUserConflict:
    action: send
    channel:
      $ref: "#/channels/crmUserConflict"
    messages:
      - $ref: "#/channels/crmUserConflict/messages/userConflict"
    summary: >-
      Publiceer conflictmelding wanneer een inschrijving binnenkomt met een
      e-mail die al bestaat in Salesforce met afwijkende gegevens. Controlroom
      logt, Frontend toont melding aan eventbeheerder.
    tags:
      - name: controlroom
      - name: frontend
      - name: release-2

  receivePaymentConfirmed:
    action: receive
    channel:
      $ref: "#/channels/kassaPaymentConfirmed"
    messages:
      - $ref: "#/channels/kassaPaymentConfirmed/messages/paymentConfirmed"
    summary: >-
      Ontvang betalingsbevestiging van Kassa en werk betalingsstatus bij op
      Contact in Salesforce (US-08, US-21).
    tags:
      - name: kassa
      - name: release-1

  receiveUnpaidRequest:
    action: receive
    channel:
      $ref: "#/channels/kassaUnpaidRequested"
    messages:
      - $ref: "#/channels/kassaUnpaidRequested/messages/unpaidRequest"
    summary: >-
      Ontvang verzoek voor lijst niet-betaalde deelnemers en stuur response
      terug (US-07).
    reply:
      channel:
        $ref: "#/channels/crmUnpaidResponded"
      messages:
        - $ref: "#/components/messages/UnpaidResponse"
    tags:
      - name: kassa
      - name: release-1

  sendUserUpdated:
    action: send
    channel:
      $ref: "#/channels/crmUserUpdated"
    messages:
      - $ref: "#/channels/crmUserUpdated/messages/userUpdated"
    summary: >-
      Publiceer volledig bijgewerkt Contact na update in Salesforce (US-21,
      US-41). Consumers updaten hun lokale kopie.
    tags:
      - name: frontend
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-2

  sendCompanyUpdated:
    action: send
    channel:
      $ref: "#/channels/crmCompanyUpdated"
    messages:
      - $ref: "#/channels/crmCompanyUpdated/messages/companyUpdated"
    summary: >-
      Publiceer volledig bijgewerkt Account na update in Salesforce (US-41).
      Facturatie gebruikt bijgewerkt adres voor facturen.
    tags:
      - name: facturatie
      - name: release-2

  receiveBounceReported:
    action: receive
    channel:
      $ref: "#/channels/mailingBounceReported"
    messages:
      - $ref: "#/channels/mailingBounceReported/messages/bounceReported"
    summary: >-
      Ontvang bouncerapport van Mailing en markeer e-mailadres als onbereikbaar
      op Contact in Salesforce (US-39).
    tags:
      - name: mailing
      - name: release-2

  sendInvoiceRequested:
    action: send
    channel:
      $ref: "#/channels/crmInvoiceRequested"
    messages:
      - $ref: "#/channels/crmInvoiceRequested/messages/invoiceRequested"
    summary: >-
      Publiceer factuurverzoek naar Facturatie nadat privépersoon adres heeft
      ingevuld (US-11). Onderscheidt een factuurverzoek van een gewone
      adresupdate.
    tags:
      - name: facturatie
      - name: release-3

  sendUserDeactivated:
    action: send
    channel:
      $ref: "#/channels/crmUserDeactivated"
    messages:
      - $ref: "#/channels/crmUserDeactivated/messages/userDeactivated"
    summary: >-
      Publiceer deactivatie van Contact na GDPR-verwijderverzoek (US-55).
      isActive=false — geen fysieke verwijdering.
    tags:
      - name: facturatie
      - name: mailing
      - name: kassa
      - name: release-3

  sendCompanyDeactivated:
    action: send
    channel:
      $ref: "#/channels/crmCompanyDeactivated"
