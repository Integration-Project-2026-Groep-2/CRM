name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

env:
  IMAGE: ghcr.io/integration-project-2026-groep-2/crm

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image_meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tag
        id: image_meta
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "image_tag=sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:${{ steps.image_meta.outputs.image_tag }}" -t "$IMAGE:latest-dev" .
          docker push "$IMAGE:${{ steps.image_meta.outputs.image_tag }}"
          docker push "$IMAGE:latest-dev"

  trigger-k8s-manifest-update:
    name: Trigger Manifest Repo Update
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Dispatch to k8s-manifests repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MANIFESTS_REPO_PAT }}
          repository: integration-project-2026-groep-2/k8s-manifests
          event-type: update-dev-image
          client-payload: |
            {
              "image": "${{ env.IMAGE }}",
              "tag": "${{ needs.build-and-push.outputs.image_tag }}",
              "service": "${{ github.event.repository.name }}",
              "commit": "${{ github.event.workflow_run.head_sha }}",
              "actor": "${{ github.actor }}"
            }
